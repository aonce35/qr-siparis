<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Menü</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <div>
      <div class="eyebrow">QR MENÜ</div>
      <h1 id="restaurantName">Menü</h1>
    </div>
    <div class="table-badge" id="tableBadge">Masa</div>
  </header>

  <main>
    <div id="notice" class="notice hidden"></div>
    <div id="categories" class="categories"></div>
    <section id="menu" class="menu"></section>
  </main>

  <button id="cartButton" class="cart-button" onclick="openCart()">
    Sepet <span id="cartCount">0</span>
  </button>

  <div id="cartModal" class="modal hidden">
    <div class="modal-card">
      <div class="modal-head">
        <h2>Sepet</h2>
        <button onclick="closeCart()">×</button>
      </div>
      <div id="cartItems"></div>
      <div class="order-summary">
        <span>Toplam</span><strong id="cartTotal">₺0</strong>
      </div>
      <label class="label">Sipariş notu</label>
      <textarea id="orderNote" placeholder="Örn. Soğansız, sos ayrı, acele değil..."></textarea>
      <button class="primary" onclick="placeOrder()">Siparişi Gönder</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="./app.js?v=2"></script>
</body>
</html>
