<!doctype html>
<html lang="tr">

<head>
<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>MRX</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

html {
  background: #f5f5f5;
  color: #111;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #f5f5f5;
  color: #111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
textarea,
input {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =====================================================
   WELCOME
===================================================== */

#mrxWelcome {
  position: fixed;
  inset: 0;
  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px;

  background: #000;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

#mrxWelcome.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.mrx-welcome-content {
  width: 100%;
  max-width: 380px;

  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.mrx-logo {
  margin: 0;

  color: #fff;

  font-size: 62px;
  font-weight: 700;

  letter-spacing: 8px;
  line-height: 1;
}

.mrx-slogan {
  margin: 25px 0 42px;

  color: #fff;

  font-size: 17px;
  font-weight: 400;

  line-height: 1.5;
}

.mrx-menu-button {
  width: 100%;
  max-width: 280px;

  padding: 17px 24px;

  border: 1px solid #fff;
  border-radius: 12px;

  background: #fff;
  color: #000;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;
}

.mrx-menu-button:active {
  transform: scale(.97);
}

.mrx-footer {
  margin-top: 48px;

  color: #666;

  font-size: 10px;

  letter-spacing: 2px;
}


/* =====================================================
   LANGUAGE
===================================================== */

.language-selector {
  position: relative;
  margin-top: 18px;

  display: flex;
  justify-content: center;
}

.language-button {
  width: 44px;
  height: 44px;

  padding: 0;

  border: 2px solid #fff;
  border-radius: 50%;

  background: #fff;

  font-size: 24px;
  line-height: 1;

  cursor: pointer;

  display: flex;
  align-items: center;
  justify-content: center;

  box-shadow:
    0 4px 14px rgba(0,0,0,.25);

  transition: transform .15s ease;
}

.language-button:active {
  transform: scale(.94);
}

.language-menu {
  position: absolute;

  left: 50%;
  bottom: 54px;

  transform: translateX(-50%);

  display: none;

  min-width: 155px;

  padding: 6px;

  border-radius: 14px;

  background: #fff;

  box-shadow:
    0 8px 30px rgba(0,0,0,.3);
}

.language-menu.visible {
  display: block;
}

.language-option {
  width: 100%;

  padding: 11px 13px;

  border: 0;
  border-radius: 10px;

  background: transparent;
  color: #111;

  font-size: 14px;
  font-weight: 600;

  text-align: left;

  cursor: pointer;
}

.language-option:hover {
  background: #f1f1f1;
}


/* =====================================================
   MAIN
===================================================== */

#mainMenuContent {
  display: none;
  min-height: 100vh;
  background: #f5f5f5;
}

#mainMenuContent.visible {
  display: block;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {
  position: sticky;
  top: 0;
  z-index: 100;

  display: flex;
  align-items: center;
  justify-content: space-between;

  padding: 20px 18px 16px;

  background: #fff;

  border-bottom: 1px solid #e5e5e5;
}

.eyebrow {
  margin-bottom: 5px;

  color: #888;

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 2px;
  text-transform: uppercase;
}

#restaurantName {
  margin: 0;

  color: #111;

  font-size: 25px;
  font-weight: 700;

  letter-spacing: -.6px;
}

.table-badge {
  padding: 8px 12px;

  border-radius: 10px;

  background: #111;
  color: #fff;

  font-size: 13px;
  font-weight: 600;

  white-space: nowrap;
}


/* =====================================================
   MY ORDERS
===================================================== */

.my-orders-button-wrapper {
  padding: 12px 16px;
  background: #fff;
}

#myOrdersButton {
  display: block;
  width: 100%;

  padding: 13px 16px;

  border: 1px solid #dedede;
  border-radius: 12px;

  background: #fff;
  color: #111;

  font-size: 14px;
  font-weight: 600;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 2px 8px rgba(0,0,0,.04);
}


/* =====================================================
   MAIN CONTENT
===================================================== */

main {
  width: 100%;
  max-width: 700px;

  margin: 0 auto;

  padding:
    18px
    16px
    120px;

  background: #f5f5f5;
}


/* =====================================================
   NOTICE
===================================================== */

.notice {
  margin-bottom: 18px;

  padding: 13px 15px;

  border: 1px solid #ddd;
  border-radius: 12px;

  background: #fff;
  color: #222;

  font-size: 14px;
}


/* =====================================================
   CATEGORIES
===================================================== */

.categories {
  display: flex;
  gap: 8px;

  margin-bottom: 20px;

  overflow-x: auto;

  padding-bottom: 4px;

  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories button {
  flex: 0 0 auto;

  padding: 10px 15px;

  border: 1px solid #ddd;
  border-radius: 999px;

  background: #fff;
  color: #666;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;
}

.categories button.active {
  background: #111;
  color: #fff;
  border-color: #111;
}


/* =====================================================
   MENU
===================================================== */

.menu {
  display: flex;
  flex-direction: column;
  gap: 12px;

  background: transparent;
}

.menu section {
  scroll-margin-top: 100px;
}

.category-title {
  margin:
    12px
    3px
    10px;

  color: #111;

  font-size: 20px;
  font-weight: 700;
}


/* =====================================================
   PRODUCT
===================================================== */

.product {
  display: flex;
  align-items: center;
  justify-content: space-between;

  gap: 15px;

  margin-bottom: 10px;

  padding: 16px;

  border: 1px solid #e5e5e5;
  border-radius: 16px;

  background: #fff;

  box-shadow:
    0 2px 8px rgba(0,0,0,.035);
}

.product-info {
  min-width: 0;
  flex: 1;
}

.product h3 {
  margin: 0 0 5px;

  color: #111;

  font-size: 16px;
  font-weight: 650;
}

.product p {
  margin: 0 0 9px;

  color: #777;

  font-size: 13px;

  line-height: 1.45;
}

.price {
  color: #111;

  font-size: 15px;
  font-weight: 700;
}

.add {
  flex-shrink: 0;

  padding: 9px 13px;

  border: 1px solid #111;
  border-radius: 10px;

  background: #111;
  color: #fff;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;
}


/* =====================================================
   CART
===================================================== */

.cart-button {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform: translateX(-50%);

  z-index: 500;

  min-width: 190px;

  padding: 15px 22px;

  border: 1px solid #111;
  border-radius: 14px;

  background: #111;
  color: #fff;

  box-shadow:
    0 8px 25px rgba(0,0,0,.18);

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

#cartCount {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 21px;
  height: 21px;

  margin-left: 6px;

  padding: 0 5px;

  border-radius: 999px;

  background: #fff;
  color: #111;

  font-size: 11px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  position: fixed;
  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  padding: 15px;

  background: rgba(0,0,0,.55);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal.hidden {
  display: none;
}

.modal-card {
  width: 100%;
  max-width: 600px;

  max-height: 88vh;

  overflow-y: auto;

  padding: 20px;

  border-radius:
    22px
    22px
    16px
    16px;

  background: #fff;
  color: #111;
}


/* =====================================================
   MODAL HEADER
===================================================== */

.modal-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.modal-head h2 {
  margin: 0;

  color: #111;

  font-size: 22px;
}

.modal-head button {
  width: 34px;
  height: 34px;

  border: 0;
  border-radius: 50%;

  background: #f1f1f1;
  color: #111;

  font-size: 22px;

  cursor: pointer;
}


/* =====================================================
   CART CONTENT
===================================================== */

#cartItems {
  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-bottom: 18px;
}

.cart-row {
  padding: 13px;

  border: 1px solid #e5e5e5;
  border-radius: 12px;

  background: #fafafa;
}

.cart-main {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  color: #111;
}

.qty {
  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 10px;
}

.qty button {
  width: 30px;
  height: 30px;

  border: 0;
  border-radius: 8px;

  background: #111;
  color: #fff;

  font-size: 17px;

  cursor: pointer;
}

.item-note {
  width: 100%;

  margin-top: 10px;

  padding: 9px;

  border: 1px solid #ddd;
  border-radius: 9px;

  background: #fff;
  color: #111;

  outline: none;
}


/* =====================================================
   SUMMARY
===================================================== */

.order-summary {
  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 16px 0;

  margin-bottom: 18px;

  border-top: 1px solid #e5e5e5;
  border-bottom: 1px solid #e5e5e5;

  color: #777;
}

.order-summary strong {
  color: #111;

  font-size: 20px;
}

.label {
  display: block;

  margin-bottom: 8px;

  color: #111;

  font-size: 13px;
  font-weight: 600;
}

textarea {
  width: 100%;

  min-height: 95px;

  padding: 13px;

  margin-bottom: 14px;

  resize: vertical;

  border: 1px solid #ddd;
  border-radius: 12px;

  outline: none;

  background: #fafafa;
  color: #111;

  font-size: 14px;
}

textarea::placeholder {
  color: #999;
}

.primary {
  width: 100%;

  padding: 15px;

  border: 1px solid #111;
  border-radius: 12px;

  background: #111;
  color: #fff;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}


/* =====================================================
   ORDERS
===================================================== */

.my-order {
  margin-bottom: 14px;

  padding: 16px;

  border: 1px solid #e4e4e4;
  border-radius: 16px;

  background: #fafafa;
}

.my-order.active-order {
  background: #fff;

  border: 1px solid #111;

  box-shadow:
    0 4px 16px rgba(0,0,0,.08);
}

.my-order-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 10px;

  color: #777;

  font-size: 13px;
}

.my-order-head strong {
  color: #111;

  font-size: 15px;
}

.my-order-status {
  display: inline-block;

  margin-bottom: 15px;

  padding: 7px 10px;

  border-radius: 9px;

  background: #eee;

  color: #333;

  font-size: 12px;
  font-weight: 700;
}

.my-order-status.new {
  background: #f1f1f1;
  color: #222;
}

.my-order-status.preparing {
  background: #f1f1f1;
  color: #111;
}

.my-order-status.ready {
  background: #111;
  color: #fff;
}

.my-order-status.completed {
  background: #e8e8e8;
  color: #777;
}


/* =====================================================
   PROGRESS
===================================================== */

.order-progress {
  position: relative;

  display: flex;

  justify-content: space-between;

  margin: 8px 4px 20px;
}

.order-progress::before {
  content: "";

  position: absolute;

  left: 9px;
  right: 9px;
  top: 9px;

  height: 2px;

  background: #ddd;
}

.progress-line {
  position: absolute;

  left: 9px;
  top: 9px;

  height: 2px;

  background: #111;

  transition:
    width .35s ease;
}

.progress-step {
  position: relative;

  z-index: 2;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 6px;

  width: 25%;

  color: #aaa;

  font-size: 10px;

  text-align: center;
}

.progress-dot {
  width: 19px;
  height: 19px;

  border: 2px solid #ddd;
  border-radius: 50%;

  background: #fff;
}

.progress-step.done {
  color: #111;

  font-weight: 600;
}

.progress-step.done .progress-dot {
  border-color: #111;
  background: #111;
}

.progress-step.current .progress-dot {
  border-color: #111;

  background: #fff;

  box-shadow:
    0 0 0 4px rgba(0,0,0,.08);
}


/* =====================================================
   ORDER ITEMS
===================================================== */

.my-order-items {
  display: flex;

  flex-direction: column;
}

.my-order-item {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  padding: 8px 0;

  border-bottom: 1px solid #eee;

  color: #333;

  font-size: 14px;
}

.my-order-item strong {
  color: #111;
}


/* =====================================================
   TOTAL
===================================================== */

.my-order-total {
  display: flex;

  justify-content: space-between;

  margin-top: 12px;

  padding-top: 12px;

  border-top: 1px solid #ddd;

  color: #777;
}

.my-order-total strong {
  color: #111;

  font-size: 17px;
}

.my-orders-grand-total {
  display: flex;

  justify-content: space-between;

  margin-top: 16px;

  padding-top: 16px;

  border-top: 2px solid #111;

  color: #111;

  font-size: 16px;
  font-weight: 700;
}

.my-orders-grand-total strong {
  font-size: 20px;
}

.my-orders-empty {
  padding: 30px 10px;

  text-align: center;

  color: #777;
}

.my-orders-empty strong {
  display: block;

  margin-bottom: 8px;

  color: #111;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .topbar {
    padding:
      17px
      16px
      14px;
  }

  #restaurantName {
    font-size: 23px;
  }

  main {
    padding:
      16px
      14px
      115px;
  }

  .product {
    padding: 14px;
  }

  .cart-button {
    bottom: 17px;

    min-width: 180px;
  }

  .progress-step {
    font-size: 9px;
  }

}

</style>
</head>


<body>


<!-- =====================================================
     WELCOME
===================================================== -->

<section id="mrxWelcome">

  <div class="mrx-welcome-content">

    <h1 class="mrx-logo">
      MRX
    </h1>

    <p class="mrx-slogan">
      Yeni nesil sipariş deneyimi.
    </p>

    <button
      class="mrx-menu-button"
      onclick="openMRXMenu()"
    >
      Menüyü Gör →
    </button>

    <div class="mrx-footer">
      POWERED BY MRX
    </div>

    <div class="language-selector">

      <button
        id="languageButton"
        class="language-button"
        onclick="toggleLanguageMenu()"
        aria-label="Language"
      >
        🇬🇧
      </button>

      <div
        id="languageMenu"
        class="language-menu"
      >

        <button
          class="language-option"
          onclick="setLanguage('tr')"
        >
          🇹🇷 Türkçe
        </button>

        <button
          class="language-option"
          onclick="setLanguage('en')"
        >
          🇬🇧 English
        </button>

      </div>

    </div>

  </div>

</section>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="mainMenuContent">

<header class="topbar">

  <div>

    <div
      class="eyebrow"
      id="qrMenuLabel"
    >
      QR MENÜ
    </div>

    <h1 id="restaurantName">
      Menü
    </h1>

  </div>

  <div
    class="table-badge"
    id="tableBadge"
  >
    Masa
  </div>

</header>


<div class="my-orders-button-wrapper">

  <button
    id="myOrdersButton"
    onclick="openMyOrders()"
  >
    🧾 Siparişlerim
  </button>

</div>


<main>

  <div
    id="notice"
    class="notice hidden"
  ></div>

  <div
    id="categories"
    class="categories"
  ></div>

  <section
    id="menu"
    class="menu"
  ></section>

</main>


<button
  id="cartButton"
  class="cart-button"
  onclick="openCart()"
>
  Sepet
  <span id="cartCount">0</span>
</button>


<!-- =====================================================
     CART MODAL
===================================================== -->

<div
  id="cartModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2 id="cartTitle">
        Sepet
      </h2>

      <button
        onclick="closeCart()"
      >
        ×
      </button>

    </div>

    <div id="cartItems"></div>

    <div class="order-summary">

      <span id="totalLabel">
        Toplam
      </span>

      <strong id="cartTotal">
        ₺0
      </strong>

    </div>

    <label
      class="label"
      id="orderNoteLabel"
    >
      Sipariş notu
    </label>

    <textarea
      id="orderNote"
      placeholder="Örn. Soğansız, sos ayrı, acele değil..."
    ></textarea>

    <button
      class="primary"
      id="placeOrderButton"
      onclick="placeOrder()"
    >
      Siparişi Gönder
    </button>

  </div>

</div>


<!-- =====================================================
     MY ORDERS MODAL
===================================================== -->

<div
  id="myOrdersModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2 id="myOrdersTitle">
        Siparişlerim
      </h2>

      <button
        onclick="closeMyOrders()"
      >
        ×
      </button>

    </div>

    <div id="myOrders">
      <p id="ordersLoadingText">
        Siparişler yükleniyor...
      </p>
    </div>

    <div class="my-orders-grand-total">

      <span id="grandTotalLabel">
        Toplam
      </span>

      <strong id="myOrdersTotal">
        ₺0
      </strong>

    </div>

  </div>

</div>


</div>

/* =====================================================
   TRANSLATION HELPER
===================================================== */

function t(key) {

  return (
    translations[currentLanguage]?.[key] ||
    translations.tr[key] ||
    key
  );

}


/* =====================================================
   AI TRANSLATOR
===================================================== */

async function translateWithAI(text) {

  if (!text || !String(text).trim()) {
    return "";
  }

  const original =
    String(text).trim();


  /* Local cache */

  if (
    translationMemory[original]
  ) {

    return translationMemory[original];

  }


  try {

    console.log(
      "Translating:",
      original
    );


    const {
      data,
      error
    } =
      await db.functions.invoke(
        "translate-demo",
        {
          body: {
            text: original
          }
        }
      );


    if (error) {

      console.error(
        "FUNCTION ERROR:",
        error
      );

      return original;

    }


    const translated =
      data?.translation?.trim();


    if (!translated) {

      console.error(
        "No translation returned:",
        data
      );

      return original;

    }


    translationMemory[original] =
      translated;


    localStorage.setItem(
      "mrx_translation_memory",
      JSON.stringify(
        translationMemory
      )
    );


    console.log(
      "Translated:",
      original,
      "→",
      translated
    );


    return translated;

  } catch (error) {

    console.error(
      "AI TRANSLATION ERROR:",
      error
    );

    return original;

  }

}


/* =====================================================
   TRANSLATE PRODUCTS
===================================================== */

async function translateProducts() {

  if (
    currentLanguage !== "en"
  ) {

    return;

  }


  if (
    !products.length
  ) {

    return;

  }


  console.log(
    "AI translation started..."
  );


  for (
    const product of products
  ) {


    /* PRODUCT NAME */

    product._enName =
      await translateWithAI(
        product.name
      );


    /* DESCRIPTION */

    if (
      product.description
    ) {

      product._enDescription =
        await translateWithAI(
          product.description
        );

    } else {

      product._enDescription =
        "";

    }


    /* CATEGORY */

    if (
      product.category
    ) {

      product._enCategory =
        await translateWithAI(
          product.category
        );

    } else {

      product._enCategory =
        "";

    }

  }


  console.log(
    "AI translation finished.",
    products
  );

}

/* =====================================================

function getCategories() {

  return [
    ...new Set(

      products
        .map(
          product => {

            if (
              currentLanguage === "en"
            ) {

              return (
                product._enCategory ||
                product.category
              );

            }

            return product.category;

          }
        )
        .filter(Boolean)

    )
  ];

}


function renderCategories() {

  const container =
    document.getElementById(
      "categories"
    );


  if (!container) {
    return;
  }


  const categories =
    getCategories();


  container.innerHTML =
    categories
      .map(
        (
          category,
          index
        ) => `

          <button
            class="${
              index === 0
                ? "active"
                : ""
            }"
            onclick="scrollToCategory(
              '${escAttr(category)}'
            )"
          >
            ${esc(category)}

      )
      .join("");

}

    document.getElementById(
      "menu"

  if (!menu) {

    getCategories();


  menu.innerHTML =
    categories

/* =====================================================
   CART
===================================================== */

function addToCart(id) {

  const product =
    products.find(
      product =>
        String(product.id) ===
        String(id)
    );


  if (!product) {
    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      displayName:
        currentLanguage === "en"
          ? (
              product._enName ||
              product.name
            )
          : product.name,

      price:
        Number(
          product.price || 0
        ),

      qty:
        1,

      note:
        ""

    });

  }


  renderCart();

  openCart();

}


function changeQty(
  id,
  amount
) {

  const item =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  item.qty +=
    amount;


  if (
    item.qty <= 0
  ) {

    cart =
      cart.filter(
        item =>
          String(item.id) !==
          String(id)
      );

  }


  renderCart();

}


function updateItemNote(
  id,
  value
) {

  const item =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (item) {

    item.note =
      value;

  }

}


function renderCart() {

  const count =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.qty,
      0
    );


  const total =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const countElement =
    document.getElementById(
      "cartCount"
    );


  if (countElement) {

    countElement.textContent =
      count;

  }


  const totalElement =
    document.getElementById(
      "cartTotal"
    );


  if (totalElement) {

    totalElement.textContent =
      "₺" +
      total.toFixed(2);

  }


  const container =
    document.getElementById(
      "cartItems"
    );


  if (!container) {
    return;
  }


  if (!cart.length) {

    container.innerHTML =
      `<p>${esc(
        t("empty_cart")
      )}</p>`;

    return;

  }


  container.innerHTML =
    cart
      .map(
        item => `

          <div class="cart-row">

            <div class="cart-main">

              <strong>
                ${esc(
                  item.displayName ||
                  item.name
                )}
              </strong>

              <strong>
                ₺${(
                  item.price *
                  item.qty
                ).toFixed(2)}
              </strong>

            </div>

            <div class="qty">

              <button
                onclick="changeQty(
                  '${escAttr(item.id)}',
                  -1
                )"
              >
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="changeQty(
                  '${escAttr(item.id)}',
                  1
                )"
              >
                +
              </button>

            </div>

            <input
              class="item-note"
              value="${escAttr(item.note)}"
              placeholder="${escAttr(
                t("item_note")
              )}"
              oninput="updateItemNote(
                '${escAttr(item.id)}',
                this.value
              )"
            >

          </div>

        `
      )
      .join("");

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

  if (!cart.length) {

    alert(
      t("empty_cart")
    );

    return;

  }


  const button =
    document.getElementById(
      "placeOrderButton"
    );


  button.disabled =
    true;

  button.textContent =
    t("sending");


  const total =
    cart.reduce(
      (
        sum,
        item
      ) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const noteElement =
    document.getElementById(
      "orderNote"
    );


  const customerNote =
    noteElement.value.trim();


  const {
    data: order,
    error
  } =
    await db
      .from("orders")
      .insert({

        table_number:
          String(tableNumber),

        status:
          "new",

        total:
          total,

        customer_note:
          customerNote ||
          null,

        customer_id:
          customerId

      })
      .select()
      .single();


  if (error) {

    console.error(
      "ORDER ERROR:",
      error
    );


    alert(
      "Order could not be placed: " +
      error.message
    );


    button.disabled =
      false;

    button.textContent =
      t("place_order");

    return;

  }


  const orderItems =
    cart.map(
      item => ({

        order_id:
          order.id,

        product_id:
          item.id,

        product_name:
          item.name,

        quantity:
          item.qty,

        unit_price:
          item.price,

        note:
          item.note ||
          null

      })
    );


  const {
    error: itemsError
  } =
    await db
      .from("order_items")
      .insert(
        orderItems
      );


  if (itemsError) {

    console.error(
      "ITEM ERROR:",
      itemsError
    );


    alert(
      "Order items could not be saved: " +
      itemsError.message
    );


    button.disabled =
      false;

    button.textContent =
      t("place_order");

    return;

  }


  cart = [];

  noteElement.value =
    "";

  renderCart();

  closeCart();


  showNotice(
    t("order_received")
      .replace(
        "{table}",
        tableNumber
      )
  );


  button.disabled =
    false;

  button.textContent =
    t("place_order");

}

/* =====================================================
   ORDER PROGRESS
===================================================== */

function getProgressStatus(
  status
) {

  const statuses = {

    new: 0,

    preparing: 1,

    ready: 2,

    completed: 3

  };


  return (
    statuses[status] ??
    0
  );

}


function progressHTML(
  status
) {

  const current =
    getProgressStatus(
      status
    );


  const steps = [

    {
      label:
        t("received")
    },

    {
      label:
        t("preparing")
    },

    {
      label:
        t("ready")
    },

    {
      label:
        t("completed")
    }

  ];


  const lineWidth =
    (current / 3) * 100;


  return `

    <div class="order-progress">

      <div
        class="progress-line"
        style="width:${lineWidth}%"
      ></div>

      ${steps
        .map(
          (
            step,
            index
          ) => `

            <div
              class="
                progress-step
                ${
                  index <= current
                    ? "done"
                    : ""
                }
                ${
                  index === current
                    ? "current"
                    : ""
                }
              "
            >

              <div
                class="progress-dot"
              ></div>

              <span>
                ${esc(
                  step.label
                )}
              </span>

            </div>

          `
        )
        .join("")}

    </div>

  `;

}

        "customer_id",
        customerId
      )
      .order(
        "created_at",
        {
          ascending: false
        }
      );

      "MY ORDERS ERROR:",
      error
    );


    container.innerHTML =

    data

            Number(

            );


          grandTotal +=
            total;


          const date =
            new Date(
              order.created_at
            );


          const time =
            date.toLocaleTimeString(
              currentLanguage === "en"
                ? "en-GB"
                : "tr-TR",
              {
                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            );


          const statusLabels = {

            new:
              t("new"),

            preparing:
              t("preparing"),

            ready:
              t("ready"),

            completed:
              t("completed")

          };


          const statusLabel =
            statusLabels[
              order.status

            order.status;


          const items =

              order.order_items ||

            )
              .map(
                item => `

                  <div
                    class="my-order-item"
                  >

                    <span>
                      ${item.quantity} ×
                      ${esc(
                        item.product_name
                      )}
                    </span>

                    <strong>

                        Number(
                          item.unit_price ||
                          0
                        ) *
                        Number(
                          item.quantity ||
                          0
                        )
                      ).toFixed(2)}
                    </strong>

                  </div>

                `
              )
              .join("");


          return `

            <article

                    ? "active-order"
                    : ""
                }
              "
            >

              <div

                    order.status !==

                  }

                  ${time}

                class="my-order-items"
              >
                ${items}
              </div>

              <div
                class="my-order-total"
              >

                <span>
                  ${esc(
                    t("total")
                  )}
                </span>

                <strong>
                  ₺${total.toFixed(2)}
                </strong>

              </div>

            </article>

          `;

        }
      )
      .join("");


  document.getElementById(
    "myOrdersTotal"
  ).textContent =
    "₺" +
    grandTotal.toFixed(2);

}


/* =====================================================
   CART MODAL
===================================================== */

function openCart() {

  document
    .getElementById(
      "cartModal"
    )
    .classList.remove(
      "hidden"
    );

  renderCart();

}


function closeCart() {

  document
    .getElementById(
      "cartModal"
    )
    .classList.add(
      "hidden"
    );

}


/* =====================================================
   CATEGORY SCROLL
===================================================== */

function scrollToCategory(
  category
) {

  const element =
    document.getElementById(
      "cat-" +
      slug(category)
    );


  if (element) {

    element.scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

  }

}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(
  text
) {

  const notice =
    document.getElementById(
      "notice"
    );


  if (!notice) {
    return;
  }


  notice.textContent =
    text;


  notice.classList.remove(
    "hidden"
  );

}


/* =====================================================
   TABLE
===================================================== */

function updateTable() {

  const badge =
    document.getElementById(
      "tableBadge"
    );


  if (!badge) {
    return;
  }


  if (tableNumber) {

    badge.textContent =
      `${t("table")} ${tableNumber}`;

  } else {

    badge.textContent =
      t("table");

  }

}


/* =====================================================
   HELPERS
===================================================== */

function slug(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9çğıöşü]+/g,
      "-"
    );

}


function esc(
  text
) {

  return String(
    text ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#39;"

    })[character]
  );

}


function escAttr(
  text
) {

  return esc(text);

}


/* =====================================================
   OPEN MENU
===================================================== */

function openMRXMenu() {

  const welcome =
    document.getElementById(
      "mrxWelcome"
    );


  const menu =
    document.getElementById(
      "mainMenuContent"
    );


  menu.classList.add(
    "visible"
  );


  welcome.classList.add(
    "hidden"
  );


  setTimeout(
    () => {

      welcome.style.display =
        "none";

    },
    500
  );

}


/* =====================================================
   INITIAL UI
===================================================== */

applyLanguageUI();

</script>
