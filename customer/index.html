<!doctype html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"
>

<title>MRX</title>

<style>

/* =====================================================
   GENERAL
===================================================== */

* {
  box-sizing: border-box;
}

html {
  background: #f5f5f5;
  color: #111;
}

body {
  margin: 0;
  min-height: 100vh;

  background: #f5f5f5;
  color: #111;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
textarea,
input {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =====================================================
   MRX WELCOME
===================================================== */

#mrxWelcome {
  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px;

  background: #000;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

#mrxWelcome.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.mrx-welcome-content {
  width: 100%;
  max-width: 380px;

  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.mrx-logo {
  margin: 0;

  color: #fff;

  font-size: 62px;
  font-weight: 700;

  letter-spacing: 8px;
  line-height: 1;
}

.mrx-slogan {
  margin: 25px 0 42px;

  color: #fff;

  font-size: 17px;
  font-weight: 400;

  line-height: 1.5;
}

.mrx-menu-button {
  width: 100%;
  max-width: 280px;

  padding: 17px 24px;

  border: 1px solid #fff;
  border-radius: 12px;

  background: #fff;
  color: #000;

  font-size: 16px;
  font-weight: 600;

  cursor: pointer;
}

.mrx-menu-button:active {
  transform: scale(.97);
}

.mrx-footer {
  margin-top: 48px;

  color: #666;

  font-size: 10px;

  letter-spacing: 2px;
}


/* =====================================================
   MAIN MENU
===================================================== */

#mainMenuContent {
  display: none;

  min-height: 100vh;

  background: #f5f5f5;
}

#mainMenuContent.visible {
  display: block;
}


/* =====================================================
   TOPBAR
===================================================== */

.topbar {
  position: sticky;
  top: 0;

  z-index: 100;

  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 20px 18px 16px;

  background: #fff;

  border-bottom:
    1px solid #e5e5e5;
}

.eyebrow {
  margin-bottom: 5px;

  color: #888;

  font-size: 10px;
  font-weight: 700;

  letter-spacing: 2px;
  text-transform: uppercase;
}

#restaurantName {
  margin: 0;

  color: #111;

  font-size: 25px;
  font-weight: 700;

  letter-spacing: -.6px;
}

.table-badge {
  padding: 8px 12px;

  border-radius: 10px;

  background: #111;
  color: #fff;

  font-size: 13px;
  font-weight: 600;

  white-space: nowrap;
}


/* =====================================================
   MY ORDERS BUTTON
===================================================== */

.my-orders-button-wrapper {
  padding: 12px 16px;

  background: #fff;
}

#myOrdersButton {
  display: block;

  width: 100%;

  padding: 13px 16px;

  border:
    1px solid #dedede;

  border-radius: 12px;

  background: #fff;
  color: #111;

  font-size: 14px;
  font-weight: 600;

  text-align: left;

  cursor: pointer;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.04);
}

#myOrdersButton:active {
  transform: scale(.99);
}


/* =====================================================
   MAIN
===================================================== */

main {
  width: 100%;
  max-width: 700px;

  margin: 0 auto;

  padding:
    18px
    16px
    120px;

  background: #f5f5f5;
}


/* =====================================================
   NOTICE
===================================================== */

.notice {
  margin-bottom: 18px;

  padding: 13px 15px;

  border:
    1px solid #ddd;

  border-radius: 12px;

  background: #fff;

  color: #222;

  font-size: 14px;
}


/* =====================================================
   CATEGORIES
===================================================== */

.categories {
  display: flex;

  gap: 8px;

  margin-bottom: 20px;

  overflow-x: auto;

  padding-bottom: 4px;

  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories button {
  flex: 0 0 auto;

  padding: 10px 15px;

  border:
    1px solid #ddd;

  border-radius: 999px;

  background: #fff;

  color: #666;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;
}

.categories button.active {
  background: #111;
  color: #fff;

  border-color: #111;
}


/* =====================================================
   MENU
===================================================== */

.menu {
  display: flex;

  flex-direction: column;

  gap: 12px;

  background: transparent;
}

.menu section {
  scroll-margin-top: 100px;
}

.category-title {
  margin:
    12px
    3px
    10px;

  color: #111;

  font-size: 20px;
  font-weight: 700;
}


/* =====================================================
   PRODUCT
===================================================== */

.product {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 15px;

  margin-bottom: 10px;

  padding: 16px;

  border:
    1px solid #e5e5e5;

  border-radius: 16px;

  background: #fff;

  box-shadow:
    0 2px 8px
    rgba(0,0,0,.035);
}

.product-info {
  min-width: 0;
  flex: 1;
}

.product h3 {
  margin:
    0
    0
    5px;

  color: #111;

  font-size: 16px;
  font-weight: 650;
}

.product p {
  margin:
    0
    0
    9px;

  color: #777;

  font-size: 13px;

  line-height: 1.45;
}

.price {
  color: #111;

  font-size: 15px;
  font-weight: 700;
}

.add {
  flex-shrink: 0;

  padding:
    9px
    13px;

  border:
    1px solid #111;

  border-radius: 10px;

  background: #111;
  color: #fff;

  font-size: 13px;
  font-weight: 600;

  cursor: pointer;
}


/* =====================================================
   CART BUTTON
===================================================== */

.cart-button {
  position: fixed;

  left: 50%;
  bottom: 20px;

  transform:
    translateX(-50%);

  z-index: 500;

  min-width: 190px;

  padding:
    15px
    22px;

  border:
    1px solid #111;

  border-radius: 14px;

  background: #111;
  color: #fff;

  box-shadow:
    0 8px 25px
    rgba(0,0,0,.18);

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}

#cartCount {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 21px;
  height: 21px;

  margin-left: 6px;

  padding:
    0
    5px;

  border-radius: 999px;

  background: #fff;
  color: #111;

  font-size: 11px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  padding: 15px;

  background:
    rgba(0,0,0,.55);

  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
}

.modal.hidden {
  display: none;
}

.modal-card {
  width: 100%;
  max-width: 600px;

  max-height: 88vh;

  overflow-y: auto;

  padding: 20px;

  border-radius:
    22px
    22px
    16px
    16px;

  background: #fff;
  color: #111;
}


/* =====================================================
   MODAL HEADER
===================================================== */

.modal-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.modal-head h2 {
  margin: 0;

  color: #111;

  font-size: 22px;
}

.modal-head button {
  width: 34px;
  height: 34px;

  border: 0;

  border-radius: 50%;

  background: #f1f1f1;
  color: #111;

  font-size: 22px;

  cursor: pointer;
}


/* =====================================================
   CART
===================================================== */

#cartItems {
  display: flex;

  flex-direction: column;

  gap: 10px;

  margin-bottom: 18px;
}

.cart-row {
  padding: 13px;

  border:
    1px solid #e5e5e5;

  border-radius: 12px;

  background: #fafafa;
}

.cart-main {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  color: #111;
}

.qty {
  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 10px;
}

.qty button {
  width: 30px;
  height: 30px;

  border: 0;

  border-radius: 8px;

  background: #111;
  color: #fff;

  font-size: 17px;

  cursor: pointer;
}

.item-note {
  width: 100%;

  margin-top: 10px;

  padding: 9px;

  border:
    1px solid #ddd;

  border-radius: 9px;

  background: #fff;
  color: #111;

  outline: none;
}


/* =====================================================
   SUMMARY
===================================================== */

.order-summary {
  display: flex;

  align-items: center;
  justify-content: space-between;

  padding: 16px 0;

  margin-bottom: 18px;

  border-top:
    1px solid #e5e5e5;

  border-bottom:
    1px solid #e5e5e5;

  color: #777;
}

.order-summary strong {
  color: #111;

  font-size: 20px;
}

.label {
  display: block;

  margin-bottom: 8px;

  color: #111;

  font-size: 13px;
  font-weight: 600;
}

textarea {
  width: 100%;

  min-height: 95px;

  padding: 13px;

  margin-bottom: 14px;

  resize: vertical;

  border:
    1px solid #ddd;

  border-radius: 12px;

  outline: none;

  background: #fafafa;
  color: #111;

  font-size: 14px;
}

textarea::placeholder {
  color: #999;
}

.primary {
  width: 100%;

  padding: 15px;

  border:
    1px solid #111;

  border-radius: 12px;

  background: #111;
  color: #fff;

  font-size: 15px;
  font-weight: 700;

  cursor: pointer;
}


/* =====================================================
   MY ORDERS
===================================================== */

.my-order {
  margin-bottom: 12px;

  padding: 15px;

  border:
    1px solid #e5e5e5;

  border-radius: 14px;

  background: #fafafa;
}

.my-order-head {
  display: flex;

  justify-content: space-between;

  margin-bottom: 10px;

  color: #777;

  font-size: 13px;
}

.my-order-head strong {
  color: #111;
}

.my-order-status {
  display: inline-block;

  margin-bottom: 12px;

  padding: 6px 9px;

  border-radius: 8px;

  background: #eee;

  color: #333;

  font-size: 12px;
  font-weight: 600;
}

.my-order-items {
  display: flex;

  flex-direction: column;
}

.my-order-item {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  padding: 7px 0;

  border-bottom:
    1px solid #eee;

  color: #333;

  font-size: 14px;
}

.my-order-item strong {
  color: #111;
}

.my-order-total {
  display: flex;

  justify-content: space-between;

  margin-top: 12px;

  padding-top: 12px;

  border-top:
    1px solid #ddd;

  color: #777;
}

.my-order-total strong {
  color: #111;

  font-size: 17px;
}

.my-orders-grand-total {
  display: flex;

  justify-content: space-between;

  margin-top: 16px;

  padding-top: 16px;

  border-top:
    2px solid #111;

  color: #111;

  font-size: 16px;
  font-weight: 700;
}

.my-orders-grand-total strong {
  font-size: 20px;
}

.my-orders-empty {
  padding: 30px 10px;

  text-align: center;

  color: #777;
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .topbar {
    padding:
      17px
      16px
      14px;
  }

  #restaurantName {
    font-size: 23px;
  }

  main {
    padding:
      16px
      14px
      115px;
  }

  .product {
    padding: 14px;
  }

  .cart-button {
    bottom: 17px;

    min-width: 180px;
  }
}

</style>

</head>


<body>


<!-- =====================================================
     MRX WELCOME
===================================================== -->

<section id="mrxWelcome">

  <div class="mrx-welcome-content">

    <h1 class="mrx-logo">
      MRX
    </h1>

    <p class="mrx-slogan">
      Yeni nesil sipariş deneyimi.
    </p>

    <button
      class="mrx-menu-button"
      onclick="openMRXMenu()"
    >
      Menüyü Gör →
    </button>

    <div class="mrx-footer">
      POWERED BY MRX
    </div>

  </div>

</section>


<!-- =====================================================
     MAIN MENU
===================================================== -->

<div id="mainMenuContent">


<header class="topbar">

  <div>

    <div class="eyebrow">
      QR MENÜ
    </div>

    <h1 id="restaurantName">
      Menü
    </h1>

  </div>

  <div
    class="table-badge"
    id="tableBadge"
  >
    Masa
  </div>

</header>


<!-- MY ORDERS -->

<div class="my-orders-button-wrapper">

  <button
    id="myOrdersButton"
    onclick="openMyOrders()"
  >
    🧾 Siparişlerim
  </button>

</div>


<main>

  <div
    id="notice"
    class="notice hidden"
  ></div>


  <div
    id="categories"
    class="categories"
  ></div>


  <section
    id="menu"
    class="menu"
  ></section>

</main>


<!-- CART -->

<button
  id="cartButton"
  class="cart-button"
  onclick="openCart()"
>
  Sepet

  <span id="cartCount">
    0
  </span>
</button>


<!-- CART MODAL -->

<div
  id="cartModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2>
        Sepet
      </h2>

      <button
        onclick="closeCart()"
      >
        ×
      </button>

    </div>


    <div id="cartItems"></div>


    <div class="order-summary">

      <span>
        Toplam
      </span>

      <strong id="cartTotal">
        ₺0
      </strong>

    </div>


    <label class="label">
      Sipariş notu
    </label>


    <textarea
      id="orderNote"
      placeholder="Örn. Soğansız, sos ayrı, acele değil..."
    ></textarea>


    <button
      class="primary"
      onclick="placeOrder()"
    >
      Siparişi Gönder
    </button>

  </div>

</div>


<!-- MY ORDERS MODAL -->

<div
  id="myOrdersModal"
  class="modal hidden"
>

  <div class="modal-card">

    <div class="modal-head">

      <h2>
        Siparişlerim
      </h2>

      <button
        onclick="closeMyOrders()"
      >
        ×
      </button>

    </div>


    <div id="myOrders">

      <p>
        Siparişler yükleniyor...
      </p>

    </div>


    <div class="my-orders-grand-total">

      <span>
        Toplam
      </span>

      <strong id="myOrdersTotal">
        ₺0
      </strong>

    </div>

  </div>

</div>


</div>


<!-- =====================================================
     SUPABASE
===================================================== -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>


<script>

/* =====================================================
   SUPABASE
===================================================== */

const SUPABASE_URL =
  "https://dppqwqsawarkyzzonzyu.supabase.co";

const SUPABASE_ANON_KEY =
  "sb_publishable_fhNovHoi8Xgh1jScRsdrgQ_ZCe6I4tP";

const db =
  supabase.createClient(
    SUPABASE_URL,
    SUPABASE_ANON_KEY
  );


/* =====================================================
   CUSTOMER
===================================================== */

let customerId =
  localStorage.getItem(
    "mrx_customer_id"
  );

if (!customerId) {

  customerId =
    crypto.randomUUID();

  localStorage.setItem(
    "mrx_customer_id",
    customerId
  );
}


/* =====================================================
   TABLE
===================================================== */

const params =
  new URLSearchParams(
    window.location.search
  );

const tableNumber =
  params.get("table");


/* =====================================================
   STATE
===================================================== */

let products = [];

let cart = [];


/* =====================================================
   INIT
===================================================== */

document.addEventListener(
  "DOMContentLoaded",
  init
);


async function init() {

  if (!tableNumber) {

    showNotice(
      "Masa bilgisi bulunamadı."
    );

    return;
  }


  const tableBadge =
    document.getElementById(
      "tableBadge"
    );

  if (tableBadge) {

    tableBadge.textContent =
      `Masa ${tableNumber}`;

  }


  await loadRestaurant();

  await loadProducts();

  renderCategories();

  renderMenu();

  renderCart();

}


/* =====================================================
   RESTAURANT
===================================================== */

async function loadRestaurant() {

  const {
    data,
    error
  } = await db
    .from(
      "restaurant_settings"
    )
    .select("name")
    .limit(1)
    .maybeSingle();


  if (error) {

    console.error(
      error
    );

    return;
  }


  if (
    data &&
    data.name
  ) {

    document.getElementById(
      "restaurantName"
    ).textContent =
      data.name;

  }

}


/* =====================================================
   PRODUCTS
===================================================== */

async function loadProducts() {

  const {
    data,
    error
  } = await db
    .from("products")
    .select(
      "id,name,description,category,price,is_active,sort_order"
    )
    .eq(
      "is_active",
      true
    )
    .order(
      "sort_order",
      {
        ascending: true
      }
    );


  if (error) {

    console.error(
      error
    );

    showNotice(
      "Menü yüklenemedi."
    );

    return;
  }


  products =
    Array.isArray(data)
      ? data
      : [];

}


/* =====================================================
   CATEGORIES
===================================================== */

function getCategories() {

  return [
    ...new Set(
      products
        .map(
          p =>
            p.category
        )
        .filter(Boolean)
    )
  ];

}


function renderCategories() {

  const element =
    document.getElementById(
      "categories"
    );


  const list =
    getCategories();


  element.innerHTML =
    list.map(
      (
        category,
        index
      ) => `

        <button
          class="${
            index === 0
              ? "active"
              : ""
          }"
          onclick="scrollToCategory('${escAttr(
            category
          )}')"
        >
          ${esc(category)}
        </button>

      `
    ).join("");

}


/* =====================================================
   MENU
===================================================== */

function renderMenu() {

  const menu =
    document.getElementById(
      "menu"
    );


  const list =
    getCategories();


  menu.innerHTML =
    list.map(
      category => {

        const categoryProducts =
          products.filter(
            p =>
              p.category ===
              category
          );


        return `

          <section
            id="cat-${slug(category)}"
          >

            <h2 class="category-title">
              ${esc(category)}
            </h2>

            ${categoryProducts
              .map(productHTML)
              .join("")}

          </section>

        `;

      }
    ).join("");

}


function productHTML(
  product
) {

  return `

    <article class="product">

      <div class="product-info">

        <h3>
          ${esc(product.name)}
        </h3>

        <p>
          ${esc(
            product.description || ""
          )}
        </p>

        <div class="price">
          ₺${Number(
            product.price || 0
          ).toFixed(2)}
        </div>

      </div>

      <button
        class="add"
        onclick="addToCart('${escAttr(
          product.id
        )}')"
      >
        Ekle
      </button>

    </article>

  `;

}


/* =====================================================
   CART
===================================================== */

function addToCart(
  id
) {

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if (!product) {
    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      price:
        Number(
          product.price || 0
        ),

      qty:
        1,

      note:
        ""

    });

  }


  renderCart();

  openCart();

}


function changeQty(
  id,
  amount
) {

  const item =
    cart.find(
      i =>
        String(i.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  item.qty +=
    amount;


  if (
    item.qty <= 0
  ) {

    cart =
      cart.filter(
        i =>
          String(i.id) !==
          String(id)
      );

  }


  renderCart();

}


function updateItemNote(
  id,
  value
) {

  const item =
    cart.find(
      i =>
        String(i.id) ===
        String(id)
    );


  if (item) {

    item.note =
      value;

  }

}


function renderCart() {

  const count =
    cart.reduce(
      (sum, item) =>
        sum + item.qty,
      0
    );


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;


  document.getElementById(
    "cartTotal"
  ).textContent =
    "₺" +
    total.toFixed(2);


  const container =
    document.getElementById(
      "cartItems"
    );


  if (!cart.length) {

    container.innerHTML =
      "<p>Sepet boş.</p>";

    return;
  }


  container.innerHTML =
    cart.map(
      item => `

        <div class="cart-row">

          <div class="cart-main">

            <strong>
              ${esc(item.name)}
            </strong>

            <strong>
              ₺${(
                item.price *
                item.qty
              ).toFixed(2)}
            </strong>

          </div>


          <div class="qty">

            <button
              onclick="changeQty(
                '${escAttr(item.id)}',
                -1
              )"
            >
              −
            </button>

            <span>
              ${item.qty}
            </span>

            <button
              onclick="changeQty(
                '${escAttr(item.id)}',
                1
              )"
            >
              +
            </button>

          </div>


          <input
            class="item-note"
            value="${escAttr(item.note)}"
            placeholder="Bu ürün için not..."
            oninput="updateItemNote(
              '${escAttr(item.id)}',
              this.value
            )"
          >

        </div>

      `
    ).join("");

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

  if (!cart.length) {

    alert(
      "Sepet boş."
    );

    return;
  }


  const button =
    document.querySelector(
      ".primary"
    );


  button.disabled =
    true;

  button.textContent =
    "Gönderiliyor...";


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const noteElement =
    document.getElementById(
      "orderNote"
    );


  const customerNote =
    noteElement.value.trim();


  const {
    data: order,
    error
  } = await db
    .from("orders")
    .insert({

      table_number:
        String(tableNumber),

      status:
        "new",

      total:
        total,

      customer_note:
        customerNote ||
        null,

      customer_id:
        customerId

    })
    .select()
    .single();


  if (error) {

    console.error(
      error
    );

    alert(
      "Sipariş gönderilemedi: " +
      error.message
    );

    button.disabled =
      false;

    button.textContent =
      "Siparişi Gönder";

    return;
  }


  const orderItems =
    cart.map(
      item => ({

        order_id:
          order.id,

        product_id:
          item.id,

        product_name:
          item.name,

        quantity:
          item.qty,

        unit_price:
          item.price,

        note:
          item.note ||
          null

      })
    );


  const {
    error: itemsError
  } = await db
    .from("order_items")
    .insert(
      orderItems
    );


  if (itemsError) {

    alert(
      "Sipariş ürünleri kaydedilemedi: " +
      itemsError.message
    );

    button.disabled =
      false;

    button.textContent =
      "Siparişi Gönder";

    return;
  }


  cart = [];

  noteElement.value =
    "";

  renderCart();

  closeCart();


  showNotice(
    `Siparişiniz alındı. Masa ${tableNumber}.`
  );


  button.disabled =
    false;

  button.textContent =
    "Siparişi Gönder";

}


/* =====================================================
   MY ORDERS
===================================================== */

async function openMyOrders() {

  const modal =
    document.getElementById(
      "myOrdersModal"
    );


  modal.classList.remove(
    "hidden"
  );


  await loadMyOrders();

}


function closeMyOrders() {

  document.getElementById(
    "myOrdersModal"
  ).classList.add(
    "hidden"
  );

}


async function loadMyOrders() {

  const container =
    document.getElementById(
      "myOrders"
    );


  container.innerHTML =
    "<p>Siparişler yükleniyor...</p>";


  const {
    data,
    error
  } = await db
    .from("orders")
    .select(`
      id,
      created_at,
      status,
      total,
      order_items (
        product_name,
        quantity,
        unit_price,
        note
      )
    `)
    .eq(
      "customer_id",
      customerId
    )
    .order(
      "created_at",
      {
        ascending:
          false
      }
    );


  if (error) {

    console.error(
      "MY ORDERS ERROR:",
      error
    );


    container.innerHTML = `
      <p>
        Sipariş geçmişi yüklenemedi:
        ${esc(error.message)}
      </p>
    `;

    return;
  }


  if (
    !data ||
    !data.length
  ) {

    container.innerHTML = `
      <div class="my-orders-empty">

        <strong>
          Henüz siparişiniz yok.
        </strong>

        <p>
          Verdiğiniz siparişler burada görünecek.
        </p>

      </div>
    `;


    document.getElementById(
      "myOrdersTotal"
    ).textContent =
      "₺0";

    return;
  }


  let grandTotal =
    0;


  container.innerHTML =
    data.map(
      order => {

        const total =
          Number(
            order.total || 0
          );


        grandTotal +=
          total;


        const time =
          new Date(
            order.created_at
          ).toLocaleTimeString(
            "tr-TR",
            {
              hour:
                "2-digit",
              minute:
                "2-digit"
            }
          );


        const statusNames = {

          new:
            "Yeni",

          preparing:
            "Hazırlanıyor",

          ready:
            "Hazır",

          completed:
            "Tamamlandı"

        };


        const statusName =
          statusNames[
            order.status
          ] ||
          order.status;


        const items =
          (
            order.order_items ||
            []
          ).map(
            item => `

              <div
                class="my-order-item"
              >

                <span>
                  ${item.quantity} ×
                  ${esc(
                    item.product_name
                  )}
                </span>

                <strong>
                  ₺${(
                    Number(
                      item.unit_price ||
                      0
                    ) *
                    Number(
                      item.quantity ||
                      0
                    )
                  ).toFixed(2)}
                </strong>

              </div>

            `
          ).join("");


        return `

          <article
            class="my-order"
          >

            <div
              class="my-order-head"
            >

              <strong>
                Sipariş
              </strong>

              <span>
                ${time}
              </span>

            </div>


            <div
              class="my-order-status"
            >
              ${esc(
                statusName
              )}
            </div>


            <div>
              ${items}
            </div>


            <div
              class="my-order-total"
            >

              <span>
                Toplam
              </span>

              <strong>
                ₺${total.toFixed(2)}
              </strong>

            </div>

          </article>

        `;

      }
    ).join("");


  document.getElementById(
    "myOrdersTotal"
  ).textContent =
    "₺" +
    grandTotal.toFixed(2);

}

function scrollToCategory(
  category
) {

  const element =
    document.getElementById(
      "cat-" +
      slug(category)
    );


  if (element) {

    element.scrollIntoView({
      behavior:
        "smooth",

      block:
        "start"
    });

  }

}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(
  text
) {

  const notice =
    document.getElementById(
      "notice"
    );


  if (!notice) {
    return;
  }


  notice.textContent =
    text;


  notice.classList.remove(
    "hidden"
  );

}


/* =====================================================
   HELPERS
===================================================== */

function slug(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9çğıöşü]+/g,
      "-"
    );

}


function esc(
  text
) {

  return String(
    text ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#39;"

    })[character]
  );

}


function escAttr(
  text
) {

  return esc(text);

}
