<!doctype html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MRX</title>

  <link
    rel="stylesheet"
    href="style.css?v=100"
  >

  <style>

    /* =====================================
       MRX GİRİŞ EKRANI
    ===================================== */

    #mrxWelcome {
      position: fixed;
      inset: 0;
      z-index: 99999;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;

      box-sizing: border-box;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }


    #mrxWelcome.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    .mrx-welcome-content {
      width: 100%;
      max-width: 380px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    .mrx-logo {
      margin: 0;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 62px;
      font-weight: 700;

      letter-spacing: 8px;

      line-height: 1;
    }


    .mrx-slogan {
      margin: 25px 0 42px;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 17px;
      font-weight: 400;

      letter-spacing: 0.2px;

      line-height: 1.5;
    }


    .mrx-menu-button {
      width: 100%;
      max-width: 280px;

      padding: 17px 24px;

      box-sizing: border-box;

      border: 1px solid #fff;
      border-radius: 12px;

      background: #fff;
      color: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 16px;
      font-weight: 600;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .mrx-menu-button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }


    .mrx-footer {
      margin-top: 48px;

      color: #666;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 10px;

      letter-spacing: 2px;
    }



    /* =====================================
       MENÜ BAŞLANGIÇTA GİZLİ
    ===================================== */

    #mainMenuContent {
      display: none;
    }


    #mainMenuContent.visible {
      display: block;
    }



    /* =====================================
       MENÜ AÇILDIKTAN SONRA BEYAZ TEMA
       BUNLAR SADECE MENÜYÜ ETKİLER
    ===================================== */

    #mainMenuContent {
      background: #f5f5f5;
      color: #111;

      min-height: 100vh;
    }


    #mainMenuContent .topbar {
      background: #fff !important;
      color: #111 !important;

      border-bottom:
        1px solid #e5e5e5 !important;
    }


    #mainMenuContent .eyebrow {
      color: #888 !important;
    }


    #mainMenuContent #restaurantName {
      color: #111 !important;
    }


    #mainMenuContent .table-badge {
      background: #111 !important;
      color: #fff !important;
    }


    #mainMenuContent main {
      background: #f5f5f5 !important;
      color: #111 !important;
    }


    #mainMenuContent .categories {
      background: transparent !important;
    }


    #mainMenuContent .categories button {
      background: #fff !important;
      color: #666 !important;

      border-color: #ddd !important;
    }


    #mainMenuContent .categories button.active,
    #mainMenuContent .categories button.selected {
      background: #111 !important;
      color: #fff !important;

      border-color: #111 !important;
    }


    #mainMenuContent .menu {
      background: transparent !important;
    }


    /* Ürün kartları */

    #mainMenuContent .menu > div,
    #mainMenuContent .menu > article,
    #mainMenuContent .menu-item,
    #mainMenuContent .product,
    #mainMenuContent .product-card,
    #mainMenuContent .item-card,
    #mainMenuContent .food-card {

      background: #fff !important;

      color: #111 !important;

      border-color: #e5e5e5 !important;
    }


    #mainMenuContent .menu h1,
    #mainMenuContent .menu h2,
    #mainMenuContent .menu h3,
    #mainMenuContent .menu h4 {

      color: #111 !important;
    }


    #mainMenuContent .menu p {
      color: #777 !important;
    }


    #mainMenuContent .menu strong {
      color: #111 !important;
    }


    /* Ürün butonları */

    #mainMenuContent .menu button {
      background: #111 !important;
      color: #fff !important;

      border-color: #111 !important;
    }


    /* Sepet */

    #mainMenuContent .cart-button {
      background: #111 !important;
      color: #fff !important;

      border-color: #111 !important;
    }


    #mainMenuContent #cartCount {
      background: #fff !important;
      color: #111 !important;
    }


    /* Sepet penceresi */

    #mainMenuContent .modal-card {
      background: #fff !important;
      color: #111 !important;

      border-color: #e5e5e5 !important;
    }


    #mainMenuContent .modal-card h2,
    #mainMenuContent .modal-card span,
    #mainMenuContent .modal-card strong,
    #mainMenuContent .modal-card label {

      color: #111 !important;
    }


    #mainMenuContent #cartItems > div {
      background: #fafafa !important;
      color: #111 !important;

      border-color: #e5e5e5 !important;
    }


    #mainMenuContent .order-summary {
      color: #777 !important;

      border-color: #e5e5e5 !important;
    }


    #mainMenuContent .order-summary strong {
      color: #111 !important;
    }


    #mainMenuContent textarea {
      background: #fafafa !important;
      color: #111 !important;

      border-color: #ddd !important;
    }


    #mainMenuContent textarea::placeholder {
      color: #999 !important;
    }


    #mainMenuContent .primary {
      background: #111 !important;
      color: #fff !important;

      border-color: #111 !important;
    }

  </style>

</head>


<body>


  <!-- =====================================
       MRX GİRİŞ
  ===================================== -->

  <section id="mrxWelcome">

    <div class="mrx-welcome-content">

      <h1 class="mrx-logo">
        MRX
      </h1>


      <p class="mrx-slogan">
        Yeni nesil sipariş deneyimi.
      </p>


      <button
        class="mrx-menu-button"
        onclick="openMRXMenu()"
      >
        Menüyü Gör →
      </button>


      <div class="mrx-footer">
        POWERED BY MRX
      </div>

    </div>

  </section>



  <!-- =====================================
       MEVCUT MENÜ
  ===================================== -->

  <div id="mainMenuContent">


    <header class="topbar">

      <div>

        <div class="eyebrow">
          QR MENÜ
        </div>

        <h1 id="restaurantName">
          Menü
        </h1>

      </div>


      <div
        class="table-badge"
        id="tableBadge"
      >
        Masa
      </div>

    </header>



    <main>

      <div
        id="notice"
        class="notice hidden"
      ></div>


      <div
        id="categories"
        class="categories"
      ></div>


      <section
        id="menu"
        class="menu"
      ></section>

    </main>



    <button
      id="cartButton"
      class="cart-button"
      onclick="openCart()"
    >

      Sepet

      <span id="cartCount">
        0
      </span>

    </button>



    <div
      id="cartModal"
      class="modal hidden"
    >

      <div class="modal-card">


        <div class="modal-head">

          <h2>
            Sepet
          </h2>


          <button
            onclick="closeCart()"
          >
            ×
          </button>

        </div>



        <div
          id="cartItems"
        ></div>



        <div class="order-summary">

          <span>
            Toplam
          </span>

          <strong id="cartTotal">
            ₺0
          </strong>

        </div>



        <label class="label">
          Sipariş notu
        </label>


        <textarea
          id="orderNote"
          placeholder="Örn. Soğansız, sos ayrı, acele değil..."
        ></textarea>


        <button
          class="primary"
          onclick="placeOrder()"
        >
          Siparişi Gönder
        </button>


      </div>

    </div>

  </div>



  <!-- =====================================
       SUPABASE
  ===================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script
    src="./app.js?v=2"
  ></script>



  <!-- =====================================
       MRX MENÜYÜ AÇ
  ===================================== -->

  <script>

    function openMRXMenu() {

      const welcome =
        document.getElementById(
          "mrxWelcome"
        );

      const menu =
        document.getElementById(
          "mainMenuContent"
        );


      /* Önce menüyü göster */

      menu.classList.add(
        "visible"
      );


      /* MRX ekranını kapat */

      welcome.classList.add(
        "hidden"
      );


      /* Animasyon bittikten sonra
         tamamen kaldır */

      setTimeout(function () {

        welcome.style.display =
          "none";

      }, 500);

    }

  </script>


</body>

</html>
