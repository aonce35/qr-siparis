function t(key) {

  return (
    translations[
      currentLanguage
    ]?.[key] ||
    translations.tr[key] ||
    key
  );

}


function toggleLanguageMenu() {

  const menu =
    document.getElementById(
      "languageMenu"
    );

  if (!menu) {
    return;
  }

  menu.classList.toggle(
    "visible"
  );

}


function setLanguage(language) {

  if (
    language !== "tr" &&
    language !== "en"
  ) {

    return;

  }


  currentLanguage =
    language;


  localStorage.setItem(
    "mrx_language",
    language
  );


  const button =
    document.getElementById(
      "languageButton"
    );


  if (button) {

    button.textContent =
      language === "en"
        ? "🇬🇧"

  const menu =
    document.getElementById(
      "languageMenu"

  if (menu) {

/* =====================================================
   AI TRANSLATION
===================================================== */

async function translateWithAI(
  text
) {

  if (
    !text ||
    !String(text).trim()
  ) {

    return "";

  }


  const original =
    String(text).trim();


  if (
    translationMemory[
      original
    ]
  ) {

    return translationMemory[
      original
    ];

  }


  try {

    const {
      data,
      error
    } = await db.functions.invoke(
      "translate-demo",
      {
        body: {
          text: original
        }
      }
    );


    if (error) {

      console.error(
        "TRANSLATION ERROR:",
        error
      );

      return original;

    }


    const translated =
      data?.translation?.trim();


    if (!translated) {

      return original;

    }


    translationMemory[
      original
    ] =
      translated;


    localStorage.setItem(
      "mrx_translation_memory",
      JSON.stringify(
        translationMemory
      )
    );


    return translated;

  } catch (error) {

    console.error(
      "AI TRANSLATION ERROR:",
      error
    );

    return original;

  }

}


/* =====================================================
   TRANSLATE PRODUCTS
===================================================== */

async function translateProducts() {

  if (
    currentLanguage !== "en"
  ) {

    return;

  }


  if (!products.length) {

    return;

  }


  for (
    const product of products
  ) {

    product._enName =
      await translateWithAI(
        product.name
      );


    if (
      product.description
    ) {

      product._enDescription =
        await translateWithAI(
          product.description
        );

    } else {

      product._enDescription =
        "";

    }


    if (
      product.category
    ) {

      product._enCategory =
        await translateWithAI(
          product.category
        );

    } else {

      product._enCategory =
        "";

    }

  }

}

async function loadProducts() {

  const {
    data,
    error
  } = await db
    .from("products")
    .select(
      "id,name,description,category,price,is_active,sort_order"
    )
    .eq(
      "is_active",
      true
    )
    .order(
      "sort_order",
      {

      }
    );

    console.error(
      "PRODUCT ERROR:",
      error

    showNotice(
      t("menu_failed")
    );

    return;

      : [];


  if (
    currentLanguage === "en"
  ) {

    await translateProducts();

  }

}


/* =====================================================

===================================================== */

function getCategories() {

  return [
    ...new Set(
      products
        .map(
          p =>
            currentLanguage === "en"
              ? (
                  p._enCategory ||
                  p.category
                )
              : p.category
        )
        .filter(Boolean)
    )
  ];

}


function renderCategories() {

  const element =
    document.getElementById(
      "categories"
    );


  if (!element) {
    return;
  }


  element.innerHTML =
    getCategories()
      .map(
        (
          category,
          index
        ) => `

          <button
            class="${
              index === 0
                ? "active"
                : ""
            }"
            onclick="scrollToCategory('${escAttr(
              category
            )}')"
          >
            ${esc(category)}
          </button>

        `
      )
      .join("");

}


/* =====================================================
   MENU
===================================================== */

function renderMenu() {

  const menu =
    document.getElementById(
      "menu"
    );


  if (!menu) {
    return;
  }


  menu.innerHTML =
    getCategories()
      .map(
        category => {

          const categoryProducts =
            products.filter(
              p => {

                const productCategory =
                  currentLanguage === "en"
                    ? (
                        p._enCategory ||
                        p.category
                      )
                    : p.category;

                return (
                  productCategory ===
                  category
                );

              }
            );


          return `

            <section
              id="cat-${slug(category)}"
            >

              <h2
                class="category-title"
              >
                ${esc(category)}
              </h2>

              ${categoryProducts
                .map(productHTML)
                .join("")}

            </section>

          `;

        }
      )
      .join("");

}


function productHTML(
  product
) {

  const name =
    currentLanguage === "en"
      ? (
          product._enName ||
          product.name
        )
      : product.name;


  const description =
    currentLanguage === "en"
      ? (
          product._enDescription ||
          product.description ||
          ""
        )
      : (
          product.description ||
          ""
        );


  return `

    <article class="product">

      <div class="product-info">

        <h3>
          ${esc(name)}
        </h3>

        <p>
          ${esc(description)}
        </p>

        <div class="price">
          ₺${Number(
            product.price || 0
          ).toFixed(2)}
        </div>

      </div>

      <button
        class="add"
        onclick="addToCart('${escAttr(
          product.id
        )}')"
      >
        ${t("add")}
      </button>

    </article>

  `;

}


/* =====================================================
   CART
===================================================== */

function addToCart(id) {

  const product =
    products.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if (!product) {
    return;
  }


  const existing =
    cart.find(
      item =>
        String(item.id) ===
        String(id)
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      id:
        product.id,

      name:
        product.name,

      displayName:
        currentLanguage === "en"
          ? (
              product._enName ||
              product.name
            )
          : product.name,

      price:
        Number(
          product.price || 0
        ),

      qty:
        1,

      note:
        ""

    });

  }


  renderCart();

  openCart();

}


function changeQty(
  id,
  amount
) {

  const item =
    cart.find(
      i =>
        String(i.id) ===
        String(id)
    );


  if (!item) {
    return;
  }


  item.qty +=
    amount;


  if (
    item.qty <= 0
  ) {

    cart =
      cart.filter(
        i =>
          String(i.id) !==
          String(id)
      );

  }


  renderCart();

}


function updateItemNote(
  id,
  value
) {

  const item =
    cart.find(
      i =>
        String(i.id) ===
        String(id)
    );


  if (item) {

    item.note =
      value;

  }

}


function renderCart() {

  const count =
    cart.reduce(
      (sum, item) =>
        sum + item.qty,
      0
    );


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const countElement =
    document.getElementById(
      "cartCount"
    );


  if (countElement) {

    countElement.textContent =
      count;

  }


  const totalElement =
    document.getElementById(
      "cartTotal"
    );


  if (totalElement) {

    totalElement.textContent =
      "₺" +
      total.toFixed(2);

  }


  const container =
    document.getElementById(
      "cartItems"
    );


  if (!container) {
    return;
  }


  if (!cart.length) {

    container.innerHTML =
      `<p>${esc(
        t("empty_cart")
      )}</p>`;

    return;

  }


  container.innerHTML =
    cart
      .map(
        item => `

          <div class="cart-row">

            <div class="cart-main">

              <strong>
                ${esc(
                  item.displayName ||
                  item.name
                )}
              </strong>

              <strong>
                ₺${(
                  item.price *
                  item.qty
                ).toFixed(2)}
              </strong>

            </div>


            <div class="qty">

              <button
                onclick="changeQty(
                  '${escAttr(item.id)}',
                  -1
                )"
              >
                −
              </button>

              <span>
                ${item.qty}
              </span>

              <button
                onclick="changeQty(
                  '${escAttr(item.id)}',
                  1
                )"
              >
                +
              </button>

            </div>


            <input
              class="item-note"
              value="${escAttr(item.note)}"
              placeholder="${escAttr(
                t("item_note")
              )}"
              oninput="updateItemNote(
                '${escAttr(item.id)}',
                this.value
              )"
            >

          </div>

        `
      )
      .join("");

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

  if (!cart.length) {

    alert(
      t("empty_cart")
    );

    return;

  }


  const button =
    document.getElementById(
      "placeOrderButton"
    );


  button.disabled =
    true;

  button.textContent =
    t("sending");


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const noteElement =
    document.getElementById(
      "orderNote"
    );


  const customerNote =
    noteElement.value.trim();


  const {
    data: order,
    error
  } = await db
    .from("orders")
    .insert({

      table_number:
        String(tableNumber),

      status:
        "new",

      total:
        total,

      customer_note:
        customerNote ||
        null,

      customer_id:
        customerId

    })
    .select()
    .single();


  if (error) {

    console.error(
      "ORDER ERROR:",
      error
    );

    alert(
      t("order_failed") +
      error.message
    );


    button.disabled =
      false;

    button.textContent =
      t("place_order");

    return;

  }


  const orderItems =
    cart.map(
      item => ({

        order_id:
          order.id,

        product_id:
          item.id,

        /*
         * IMPORTANT:
         * The original Turkish product
         * name is stored in the order.
         * This keeps the existing system
         * compatible.
         */

        product_name:
          item.name,

        quantity:
          item.qty,

        unit_price:
          item.price,

        note:
          item.note ||
          null

      })
    );


  const {
    error: itemsError
  } = await db
    .from("order_items")
    .insert(
      orderItems
    );


  if (itemsError) {

    console.error(
      "ITEM ERROR:",
      itemsError
    );

    alert(
      t("items_failed") +
      itemsError.message
    );


    button.disabled =
      false;

    button.textContent =
      t("place_order");

    return;

  }


  cart = [];

  noteElement.value =
    "";

  renderCart();

  closeCart();


  showNotice(
    t("order_received")
      .replace(
        "{table}",
        tableNumber
      )
  );


  button.disabled =
    false;

  button.textContent =
    t("place_order");

}

/* =====================================================
   STATUS PROGRESS
===================================================== */

function getProgressStatus(
  status
) {

  const orderStatus = {

    new:
      0,

    preparing:
      1,

    ready:
      2,

    completed:
      3

  };


  return (
    orderStatus[status] ??
    0
  );

}


function progressHTML(
  status
) {

  const current =
    getProgressStatus(
      status
    );


  const steps = [

    {
      key:
        "new",

      label:
        t("received")
    },

    {
      key:
        "preparing",

      label:
        t("preparing")
    },

    {
      key:
        "ready",

      label:
        t("ready")
    },

    {
      key:
        "completed",

      label:
        t("completed")
    }

  ];


  const lineWidth =
    current === 0
      ? 0
      : (current / 3) * 100;


  return `

    <div class="order-progress">

      <div
        class="progress-line"
        style="width:${lineWidth}%"
      ></div>

      ${steps
        .map(
          (
            step,
            index
          ) => {

            const done =
              index <= current
                ? "done"
                : "";

            const currentClass =
              index === current
                ? "current"
                : "";


            return `

              <div
                class="
                  progress-step
                  ${done}
                  ${currentClass}
                "
              >

                <div
                  class="progress-dot"
                ></div>

                <span>
                  ${step.label}
                </span>

              </div>

            `;

          }
        )
        .join("")}

    </div>

  `;

}


/* =====================================================
   LOAD MY ORDERS
===================================================== */

async function loadMyOrders() {

  const container =
    document.getElementById(
      "myOrders"
    );


  container.innerHTML =
    `<p>${esc(
      t("orders_loading")
    )}</p>`;


  const {
    data,
    error
  } = await db
    .from("orders")
    .select(`
      id,
      created_at,
      status,
      total,
      order_items (
        product_name,
        quantity,
        unit_price,
        note
      )
    `)
    .eq(
      "customer_id",
      customerId
    )
    .order(
      "created_at",
      {
        ascending:
          false
      }
    );


  if (error) {

    console.error(
      "MY ORDERS ERROR:",
      error
    );


    container.innerHTML = `

      <p>
        ${esc(
          t("history_failed")
        )}
        ${esc(
          error.message
        )}
      </p>

    `;

    return;

  }


  if (
    !data ||
    !data.length
  ) {

    container.innerHTML = `

      <div
        class="my-orders-empty"
      >

        <strong>
          ${esc(
            t(
              "empty_orders_title"
            )
          )}
        </strong>

        <p>
          ${esc(
            t(
              "empty_orders_text"
            )
          )}
        </p>

      </div>

    `;


    document.getElementById(
      "myOrdersTotal"
    ).textContent =
      "₺0";


    return;

  }


  let grandTotal =
    0;


  container.innerHTML =
    data
      .map(
        (
          order
        ) => {

          const total =
            Number(
              order.total || 0
            );


          grandTotal +=
            total;


          const date =
            new Date(
              order.created_at
            );


          const time =
            date.toLocaleTimeString(
              currentLanguage === "en"
                ? "en-GB"
                : "tr-TR",
              {
                hour:
                  "2-digit",

                minute:
                  "2-digit"
              }
            );


          const statusNames = {

            new:
              t("new"),

            preparing:
              t("preparing"),

            ready:
              t("ready"),

            completed:
              t("completed")

          };


          const statusName =
            statusNames[
              order.status
            ] ||
            order.status;


          const isActive =
            order.status !==
            "completed";


          const items =
            (
              order.order_items ||
              []
            )
              .map(
                item => `

                  <div
                    class="my-order-item"
                  >

                    <span>
                      ${item.quantity} ×
                      ${esc(
                        item.product_name
                      )}
                    </span>

                    <strong>
                      ₺${(
                        Number(
                          item.unit_price ||
                          0
                        ) *
                        Number(
                          item.quantity ||
                          0
                        )
                      ).toFixed(2)}
                    </strong>

                  </div>

                `
              )
              .join("");


          return `

            <article
              class="
                my-order
                ${
                  isActive
                    ? "active-order"
                    : ""
                }
              "
            >

              <div
                class="my-order-head"
              >

                <strong>
                  ${
                    isActive
                      ? t("active_order")
                      : t("order")
                  }
                </strong>

                <span>
                  ${time}
                </span>

              </div>


              <div
                class="
                  my-order-status
                  ${esc(
                    order.status
                  )}
                "
              >

                ${esc(
                  statusName
                )}

              </div>


              ${
                isActive
                  ? progressHTML(
                      order.status
                    )
                  : ""
              }


              <div
                class="my-order-items"
              >

                ${items}

              </div>


              <div
                class="my-order-total"
              >

                <span>
                  ${esc(
                    t("total")
                  )}
                </span>

                <strong>
                  ₺${total.toFixed(2)}
                </strong>

              </div>

            </article>

          `;

        }
      )
      .join("");


  document.getElementById(
    "myOrdersTotal"
  ).textContent =
    "₺" +
    grandTotal.toFixed(2);

}

  document.getElementById(
    "cartModal"
  ).classList.remove(

  );

  renderCart();

}


function closeCart() {

  document.getElementById(
    "cartModal"
  ).classList.add(

  );

}


/* =====================================================
   CATEGORY SCROLL
===================================================== */

function scrollToCategory(
  category
) {

  const element =
    document.getElementById(
      "cat-" +
      slug(category)
    );


  if (element) {

    element.scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

  }

}


/* =====================================================
   NOTICE
===================================================== */

function showNotice(
  text
) {

  const notice =
    document.getElementById(
      "notice"
    );


  if (!notice) {
    return;
  }


  notice.textContent =
    text;


  notice.classList.remove(
    "hidden"
  );

}


/* =====================================================
   HELPERS
===================================================== */

function slug(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9çğıöşü]+/g,
      "-"
    );

}


function esc(
  text
) {

  return String(
    text ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#39;"

    })[character]
  );

}


function escAttr(
  text
) {

  return esc(text);

}


/* =====================================================
   MRX MENU
===================================================== */

function openMRXMenu() {

  const welcome =
    document.getElementById(
      "mrxWelcome"
    );


  const menu =
    document.getElementById(
      "mainMenuContent"
    );


  menu.classList.add(
    "visible"
  );


  welcome.classList.add(
    "hidden"
  );


  setTimeout(
    function() {

      welcome.style.display =
        "none";

    },
    500
  );

}


/* =====================================================
   INITIAL LANGUAGE
===================================================== */

applyStaticLanguage();
