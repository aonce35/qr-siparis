<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>MRX</title>

  <link
    rel="stylesheet"
    href="style.css"
  >

  <style>

    /* =========================
       MRX WELCOME SCREEN
    ========================= */

    #mrxWelcome {
      position: fixed;
      inset: 0;
      z-index: 99999;

      background: #000;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 28px;

      box-sizing: border-box;

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }


    #mrxWelcome.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    .mrx-welcome-content {
      width: 100%;
      max-width: 380px;

      text-align: center;

      display: flex;
      flex-direction: column;
      align-items: center;
    }


    /* MRX */

    .mrx-logo {
      margin: 0;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Display",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 62px;
      font-weight: 700;

      letter-spacing: 8px;

      line-height: 1;
    }


    /* SLOGAN */

    .mrx-slogan {
      margin: 25px 0 42px;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 17px;
      font-weight: 400;

      letter-spacing: 0.2px;

      line-height: 1.5;
    }


    /* BUTTON */

    .mrx-menu-button {
      width: 100%;
      max-width: 280px;

      box-sizing: border-box;

      padding: 17px 24px;

      border: 1px solid #fff;
      border-radius: 12px;

      background: #fff;
      color: #000;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 16px;
      font-weight: 600;

      letter-spacing: 0;

      cursor: pointer;

      -webkit-tap-highlight-color:
        transparent;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .mrx-menu-button:active {
      transform: scale(0.97);
      opacity: 0.85;
    }


    /* FOOTER */

    .mrx-footer {
      margin-top: 48px;

      color: #666;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 10px;

      letter-spacing: 2px;
    }


    /* =========================
       MENU
    ========================= */

    #mainMenuContent {
      display: none;
    }


    #mainMenuContent.visible {
      display: block;
    }

  </style>
</head>


<body>


  <!-- =========================
       MRX WELCOME
  ========================= -->

  <section id="mrxWelcome">

    <div class="mrx-welcome-content">

      <h1 class="mrx-logo">
        MRX
      </h1>


      <p class="mrx-slogan">
        Yeni nesil sipariş deneyimi.
      </p>


      <button
        class="mrx-menu-button"
        onclick="openMRXMenu()"
      >
        Menüyü Gör →
      </button>


      <div class="mrx-footer">
        POWERED BY MRX
      </div>

    </div>

  </section>



  <!-- =========================
       MEVCUT MENÜ SİSTEMİ
  ========================= -->

  <div id="mainMenuContent">

    <header class="topbar">

      <div>

        <div class="eyebrow">
          QR MENÜ
        </div>

        <h1 id="restaurantName">
          Menü
        </h1>

      </div>


      <div
        class="table-badge"
        id="tableBadge"
      >
        Masa
      </div>

    </header>


    <main>

      <div
        id="notice"
        class="notice hidden"
      ></div>


      <div
        id="categories"
        class="categories"
      ></div>


      <section
        id="menu"
        class="menu"
      ></section>

    </main>



    <button
      id="cartButton"
      class="cart-button"
      onclick="openCart()"
    >
      Sepet

      <span id="cartCount">
        0
      </span>

    </button>



    <div
      id="cartModal"
      class="modal hidden"
    >

      <div class="modal-card">

        <div class="modal-head">

          <h2>
            Sepet
          </h2>


          <button
            onclick="closeCart()"
          >
            ×
          </button>

        </div>


        <div
          id="cartItems"
        ></div>


        <div class="order-summary">

          <span>
            Toplam
          </span>

          <strong id="cartTotal">
            ₺0
          </strong>

        </div>


        <label class="label">
          Sipariş notu
        </label>


        <textarea
          id="orderNote"
          placeholder="Örn. Soğansız, sos ayrı, acele değil..."
        ></textarea>


        <button
          class="primary"
          onclick="placeOrder()"
        >
          Siparişi Gönder
        </button>

      </div>

    </div>

  </div>



  <!-- =========================
       SCRIPTS
  ========================= -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script
    src="./app.js?v=2"
  ></script>



  <!-- =========================
       MRX OPEN MENU
  ========================= -->

  <script>

    function openMRXMenu() {

      const welcome =
        document.getElementById(
          "mrxWelcome"
        );

      const menu =
        document.getElementById(
          "mainMenuContent"
        );


      menu.classList.add(
        "visible"
      );


      welcome.classList.add(
        "hidden"
      );


      setTimeout(function () {

        welcome.style.display =
          "none";

      }, 500);

    }

  </script>


</body>

</html>
