<!doctype html>
<html lang="tr">

<head>

<meta charset="UTF-8">

<meta
  name="viewport"
  content="width=device-width, initial-scale=1"

<title>Markus Foodbar</title>

<style>

/* =====================================================
   MARKUS THEME
===================================================== */

:root {
  --green: #164b38;
  --green-light: #23644b;
  --cream: #f4efe5;
  --cream-dark: #e9e2d5;
  --white: #fffdf8;
  --text: #173b2f;
  --muted: #718078;
  --border: #d8d2c5;
}

* {
  box-sizing: border-box;
}

html {
  background: var(--cream);
  color: var(--text);
  scroll-behavior: smooth;
}

body {
  margin: 0;
  min-height: 100vh;

  background: var(--cream);
  color: var(--text);

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Helvetica Neue",
    Arial,
    sans-serif;

  -webkit-font-smoothing: antialiased;
}

button,
input,
textarea {
  font-family: inherit;
}

.hidden {
  display: none !important;
}


/* =====================================================
   MRX WELCOME
===================================================== */

#mrxWelcome {
  position: fixed;
  inset: 0;

  z-index: 99999;

  display: flex;
  align-items: center;
  justify-content: center;

  padding: 28px;

  background: #000;

  transition:
    opacity .45s ease,
    visibility .45s ease;
}

#mrxWelcome.hidden {
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
}

.mrx-welcome-content {
  width: 100%;
  max-width: 380px;

  text-align: center;

  display: flex;
  flex-direction: column;
  align-items: center;
}

.mrx-logo {
  margin: 0;

  color: #fff;

  font-size: 62px;
  font-weight: 700;

  letter-spacing: 8px;
}

.mrx-slogan {
  margin: 25px 0 42px;

  color: #fff;

  font-size: 17px;
}

.mrx-menu-button {
  width: 100%;
  max-width: 280px;

  padding: 17px 24px;

  border: 1px solid #fff;
  border-radius: 12px;

  background: #fff;
  color: #000;

  font-size: 16px;
  font-weight: 600;
}

.mrx-footer {
  margin-top: 48px;

  color: #666;

  font-size: 10px;
  letter-spacing: 2px;
}


/* =====================================================
   MAIN
===================================================== */

#mainMenuContent {
  display: none;

  min-height: 100vh;

  background: var(--cream);
}

#mainMenuContent.visible {
  display: block;
}


/* =====================================================
   HEADER
===================================================== */

.topbar {
  position: sticky;
  top: 0;

  z-index: 100;

  padding:
    18px
    18px
    15px;

  background:
    rgba(244,239,229,.96);

  backdrop-filter: blur(12px);
  -webkit-backdrop-filter: blur(12px);

  border-bottom:
    1px solid var(--border);
}

.brand-area {
  text-align: center;
}

.brand-mark {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  width: 58px;
  height: 58px;

  margin-bottom: 5px;

  border:
    1px solid #c8c1b4;

  border-radius: 50%;

  background:
    rgba(255,255,255,.5);

  color: var(--green);

  font-size: 13px;
  font-weight: 700;

  letter-spacing: 2px;
}

.brand-name {
  margin: 0;

  color: var(--green);

  font-size: 26px;
  font-weight: 700;

  letter-spacing: 1px;
}

.brand-subtitle {
  margin-top: 3px;

  color: #8b938d;

  font-size: 9px;

  letter-spacing: 3px;
  text-transform: uppercase;
}

.table-badge {
  position: absolute;

  top: 20px;
  right: 16px;

  padding:
    8px
    11px;

  border:
    1px solid var(--green);

  border-radius: 10px;

  background: var(--green);
  color: #fff;

  font-size: 12px;
  font-weight: 600;
}


/* =====================================================
   ORDER BUTTON
===================================================== */

.my-orders-wrapper {
  padding:
    10px
    15px;

  background: var(--cream);
}

.my-orders-button {
  width: 100%;

  padding: 12px 15px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  background: rgba(255,253,248,.7);

  color: var(--green);

  font-size: 13px;
  font-weight: 700;

  text-align: left;
}


/* =====================================================
   MAIN
===================================================== */

main {
  max-width: 700px;

  margin: auto;

  padding:
    12px
    15px
    120px;
}


/* =====================================================
   CATEGORY BAR
===================================================== */

.categories {
  display: flex;

  gap: 8px;

  overflow-x: auto;

  margin:
    4px
    0
    22px;

  padding-bottom: 4px;

  scrollbar-width: none;
}

.categories::-webkit-scrollbar {
  display: none;
}

.categories button {
  flex: 0 0 auto;

  padding:
    9px
    14px;

  border:
    1px solid var(--border);

  border-radius: 999px;

  background:
    rgba(255,253,248,.8);

  color: var(--green);

  font-size: 12px;
  font-weight: 700;
}

.categories button.active {
  background: var(--green);
  color: #fff;

  border-color: var(--green);
}


/* =====================================================
   CATEGORY TITLE
===================================================== */

.category-title {
  margin:
    24px
    3px
    12px;

  color: var(--green);

  font-size: 22px;
  font-weight: 750;

  letter-spacing: -.3px;
}

.category-title::after {
  content: "";

  display: block;

  width: 30px;
  height: 2px;

  margin-top: 7px;

  background: var(--green);
}


/* =====================================================
   PRODUCT
===================================================== */

.product {
  display: flex;

  align-items: center;
  justify-content: space-between;

  gap: 14px;

  margin-bottom: 9px;

  padding:
    15px
    14px;

  border:
    1px solid var(--border);

  border-radius: 15px;

  background:
    rgba(255,253,248,.78);
}

.product-info {
  min-width: 0;
  flex: 1;
}

.product h3 {
  margin:
    0
    0
    4px;

  color: var(--green);

  font-size: 15px;
  font-weight: 700;
}

.product p {
  margin:
    0
    7px;

  color: var(--muted);

  font-size: 11px;

  line-height: 1.45;
}

.price {
  color: var(--green);

  font-size: 14px;
  font-weight: 750;
}

.add {
  flex-shrink: 0;

  padding:
    9px
    12px;

  border:
    1px solid var(--green);

  border-radius: 9px;

  background: var(--green);
  color: #fff;

  font-size: 12px;
  font-weight: 700;
}


/* =====================================================
   CART
===================================================== */

.cart-button {
  position: fixed;

  left: 50%;
  bottom: 18px;

  transform:
    translateX(-50%);

  z-index: 500;

  min-width: 190px;

  padding:
    15px
    22px;

  border:
    1px solid var(--green);

  border-radius: 14px;

  background: var(--green);
  color: #fff;

  box-shadow:
    0 8px 25px
    rgba(22,75,56,.25);

  font-size: 15px;
  font-weight: 750;
}

#cartCount {
  display: inline-flex;

  align-items: center;
  justify-content: center;

  min-width: 21px;
  height: 21px;

  margin-left: 6px;

  border-radius: 50%;

  background: #fff;
  color: var(--green);

  font-size: 11px;
}


/* =====================================================
   MODAL
===================================================== */

.modal {
  position: fixed;

  inset: 0;

  z-index: 1000;

  display: flex;

  align-items: flex-end;
  justify-content: center;

  padding: 12px;

  background:
    rgba(0,0,0,.48);

  backdrop-filter: blur(7px);
  -webkit-backdrop-filter: blur(7px);
}

.modal-card {
  width: 100%;
  max-width: 600px;

  max-height: 88vh;

  overflow-y: auto;

  padding: 20px;

  border-radius:
    22px
    22px
    15px
    15px;

  background: var(--white);

  color: var(--text);
}

.modal-head {
  display: flex;

  align-items: center;
  justify-content: space-between;

  margin-bottom: 18px;
}

.modal-head h2 {
  margin: 0;

  color: var(--green);

  font-size: 22px;
}

.close-button {
  width: 34px;
  height: 34px;

  border: 0;

  border-radius: 50%;

  background: var(--cream-dark);

  color: var(--green);

  font-size: 21px;
}


/* =====================================================
   CART ROW
===================================================== */

.cart-row {
  padding: 13px;

  margin-bottom: 9px;

  border:
    1px solid var(--border);

  border-radius: 12px;

  background: var(--cream);
}

.cart-main {
  display: flex;

  justify-content: space-between;

  gap: 10px;

  color: var(--green);
}

.qty {
  display: flex;

  align-items: center;

  gap: 12px;

  margin-top: 10px;
}

.qty button {
  width: 30px;
  height: 30px;

  border: 0;

  border-radius: 8px;

  background: var(--green);
  color: #fff;
}

.item-note {
  width: 100%;

  margin-top: 10px;

  padding: 9px;

  border:
    1px solid var(--border);

  border-radius: 9px;

  background: #fff;

  outline: none;
}


/* =====================================================
   SUMMARY
===================================================== */

.order-summary {
  display: flex;

  justify-content: space-between;

  padding:
    15px
    0;

  margin-top: 12px;

  border-top:
    1px solid var(--border);

  border-bottom:
    1px solid var(--border);

  color: var(--muted);
}

.order-summary strong {
  color: var(--green);

  font-size: 20px;
}

.label {
  display: block;

  margin:
    17px
    0
    7px;

  color: var(--green);

  font-size: 13px;
  font-weight: 700;
}

textarea {
  width: 100%;

  min-height: 85px;

  padding: 12px;

  border:
    1px solid var(--border);

  border-radius: 11px;

  background: #fff;

  color: var(--text);

  outline: none;
}

.primary {
  width: 100%;

  margin-top: 13px;

  padding: 15px;

  border: 0;

  border-radius: 12px;

  background: var(--green);

  color: #fff;

  font-size: 15px;
  font-weight: 750;
}


/* =====================================================
   ORDERS
===================================================== */

.my-order {
  margin-bottom: 13px;

  padding: 15px;

  border:
    1px solid var(--border);

  border-radius: 15px;

  background: var(--cream);
}

.my-order-head {
  display: flex;

  justify-content: space-between;

  margin-bottom: 10px;

  color: var(--muted);

  font-size: 12px;
}

.my-order-head strong {
  color: var(--green);

  font-size: 14px;
}

.my-order-status {
  display: inline-block;

  padding:
    6px
    9px;

  margin-bottom: 12px;

  border-radius: 8px;

  background: var(--green);

  color: #fff;

  font-size: 11px;
  font-weight: 700;
}

.my-order-item {
  display: flex;

  justify-content: space-between;

  padding:
    7px
    0;

  border-bottom:
    1px solid var(--border);

  color: var(--text);

  font-size: 13px;
}

.my-order-total {
  display: flex;

  justify-content: space-between;

  margin-top: 12px;

  color: var(--muted);
}

.my-order-total strong {
  color: var(--green);

  font-size: 17px;
}

.my-orders-grand-total {
  display: flex;

  justify-content: space-between;

  padding-top: 15px;

  border-top:
    2px solid var(--green);

  color: var(--green);

  font-weight: 700;
}


/* =====================================================
   PROGRESS
===================================================== */

.order-progress {
  position: relative;

  display: flex;

  justify-content: space-between;

  margin:
    8px
    2px
    18px;
}

.order-progress::before {
  content: "";

  position: absolute;

  left: 9px;
  right: 9px;
  top: 9px;

  height: 2px;

  background: #d6d0c5;
}

.progress-line {
  position: absolute;

  left: 9px;
  top: 9px;

  height: 2px;

  background: var(--green);
}

.progress-step {
  position: relative;

  z-index: 2;

  width: 25%;

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 5px;

  color: #999;

  font-size: 9px;

  text-align: center;
}

.progress-dot {
  width: 19px;
  height: 19px;

  border:
    2px solid #d6d0c5;

  border-radius: 50%;

  background: var(--white);
}

.progress-step.done {
  color: var(--green);
  font-weight: 700;
}

.progress-step.done .progress-dot {
  border-color: var(--green);

  background: var(--green);
}

.progress-step.current .progress-dot {
  box-shadow:
    0 0 0 4px
    rgba(22,75,56,.10);
}


/* =====================================================
   MOBILE
===================================================== */

@media (max-width: 600px) {

  .brand-name {
    font-size: 24px;
  }

  .table-badge {
    top: 17px;
  }

  main {
    padding:
      10px
      13px
      115px;
  }

  .product {
    padding: 14px 12px;
  }

  .product h3 {
    font-size: 14px;
  }

  .product p {
    font-size: 10px;
  }

}

</style>

      ["Mojito", "", 500],
      ["Strawberry Mojito", "", 500],
      ["Long Island", "", 600],
      ["Margarita", "", 500],
      ["Tequila Sunrise", "", 500],
      ["Sex On The Beach", "", 500],
      ["Bana Bırak", "", 500],
      ["Cin Tonik", "", 500],
      ["Vodka Redbull", "", 500]

    ]
  }

];


/* =====================================================
   STATE
===================================================== */

let cart = [];


/* =====================================================
   RENDER CATEGORIES
===================================================== */

function renderCategories() {

  const element =
    document.getElementById(
      "categories"
    );


  element.innerHTML =
    menuData.map(
      (category, index) => `

        <button
          class="${
            index === 0
              ? "active"
              : ""
          }"
          onclick="scrollToCategory(
            '${escAttr(category.category)}'
          )"
        >
          ${esc(category.category)}
        </button>

      `
    ).join("");

}


/* =====================================================
   RENDER MENU
===================================================== */

function renderMenu() {

  const menu =
    document.getElementById(
      "menu"
    );


  menu.innerHTML =
    menuData.map(
      category => `

        <section
          id="cat-${slug(category.category)}"
        >

          <h2
            class="category-title"
          >
            ${esc(category.category)}
          </h2>


          ${category.items
            .map(
              item => `

                <article
                  class="product"
                >

                  <div
                    class="product-info"
                  >

                    <h3>
                      ${esc(item[0])}
                    </h3>

                    ${
                      item[1]
                        ? `
                          <p>
                            ${esc(item[1])}
                          </p>
                        `
                        : ""
                    }

                    <div
                      class="price"
                    >
                      ₺${Number(
                        item[2]
                      ).toFixed(2)}
                    </div>

                  </div>


                  <button
                    class="add"
                    onclick="addToCart(
                      '${escAttr(item[0])}',
                      ${item[2]}
                    )"
                  >
                    Ekle
                  </button>

                </article>

              `
            )
            .join("")}

        </section>

      `
    ).join("");

}


/* =====================================================
   CART
===================================================== */

function addToCart(
  name,
  price
) {

  const existing =
    cart.find(
      item =>
        item.name === name
    );


  if (existing) {

    existing.qty++;

  } else {

    cart.push({

      name,
      price:
        Number(price),

      qty:
        1,

      note:
        ""

    });

  }


  renderCart();

  openCart();

}


function changeQty(
  index,
  amount
) {

  if (!cart[index]) {
    return;
  }


  cart[index].qty +=
    amount;


  if (
    cart[index].qty <= 0
  ) {

    cart.splice(
      index,
      1
    );

  }


  renderCart();

}


function renderCart() {

  const count =
    cart.reduce(
      (sum, item) =>
        sum + item.qty,
      0
    );


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  document.getElementById(
    "cartCount"
  ).textContent =
    count;


  document.getElementById(
    "cartTotal"
  ).textContent =
    "₺" +
    total.toFixed(2);


  const container =
    document.getElementById(
      "cartItems"
    );


  if (!cart.length) {

    container.innerHTML =
      "<p>Sepet boş.</p>";

    return;
  }


  container.innerHTML =
    cart.map(
      (item, index) => `

        <div class="cart-row">

          <div class="cart-main">

            <strong>
              ${esc(item.name)}
            </strong>

            <strong>
              ₺${(
                item.price *
                item.qty
              ).toFixed(2)}
            </strong>

          </div>


          <div class="qty">

            <button
              onclick="changeQty(
                ${index},
                -1
              )"
            >
              −
            </button>

            <span>
              ${item.qty}
            </span>

            <button
              onclick="changeQty(
                ${index},
                1
              )"
            >
              +
            </button>

          </div>


          <input
            class="item-note"
            placeholder="Bu ürün için not..."
            value="${escAttr(item.note)}"
            oninput="
              cart[${index}].note =
              this.value
            "
          >

        </div>

      `
    ).join("");

}


/* =====================================================
   PLACE ORDER
===================================================== */

async function placeOrder() {

  if (!cart.length) {

    alert(
      "Sepet boş."
    );

    return;
  }


  const button =
    document.querySelector(
      ".primary"
    );


  button.disabled =
    true;

  button.textContent =
    "Gönderiliyor...";


  const total =
    cart.reduce(
      (sum, item) =>
        sum +
        item.price *
        item.qty,
      0
    );


  const note =
    document.getElementById(
      "orderNote"
    ).value.trim();


  /*
    Markus ürünleri henüz
    products tablosuna bağlanmadığı
    için burada ürün ID'si kullanmıyoruz.
  */

  const {
    data: order,
    error
  } = await db
    .from("orders")
    .insert({

      table_number:
        String(tableNumber),

      status:
        "new",

      total:
        total,

      customer_note:
        note ||
        null,

      customer_id:
        customerId

    })
    .select()
    .single();


  if (error) {

    console.error(
      error
    );

    alert(
      "Sipariş gönderilemedi: " +
      error.message
    );

    button.disabled =
      false;

    button.textContent =
      "Siparişi Gönder";

    return;
  }


  const orderItems =
    cart.map(
      item => ({

        order_id:
          order.id,

        product_name:
          item.name,

        quantity:
          item.qty,

        unit_price:
          item.price,

        note:
          item.note ||
          null

      })
    );


  const {
    error: itemError
  } = await db
    .from("order_items")
    .insert(
      orderItems
    );


  if (itemError) {

    console.error(
      itemError
    );

    alert(
      "Sipariş ürünleri kaydedilemedi: " +
      itemError.message
    );

    button.disabled =
      false;

    button.textContent =
      "Siparişi Gönder";

    return;
  }


  cart = [];

  document.getElementById(
    "orderNote"
  ).value =
    "";


  renderCart();

  closeCart();


  alert(
    "Siparişiniz alındı! 🌿"
  );


  button.disabled =
    false;

  button.textContent =
    "Siparişi Gönder";

}


/* =====================================================
   MY ORDERS
===================================================== */

async function openMyOrders() {

  document.getElementById(
    "myOrdersModal"
  ).classList.remove(
    "hidden"
  );


  await loadMyOrders();

}


function closeMyOrders() {

  document.getElementById(
    "myOrdersModal"
  ).classList.add(
    "hidden"
  );

}


async function loadMyOrders() {

  const container =
    document.getElementById(
      "myOrders"
    );


  container.innerHTML =
    "Siparişler yükleniyor...";


  const {
    data,
    error
  } = await db
    .from("orders")
    .select(`
      id,
      created_at,
      status,
      total,
      order_items (
        product_name,
        quantity,
        unit_price
      )
    `)
    .eq(
      "customer_id",
      customerId
    )
    .order(
      "created_at",
      {
        ascending:
          false
      }
    );


  if (error) {

    container.innerHTML =
      `
        <p>
          Siparişler yüklenemedi:
          ${esc(error.message)}
        </p>
      `;

    return;
  }


  if (
    !data ||
    !data.length
  ) {

    container.innerHTML =
      `
        <p>
          Henüz siparişiniz yok.
        </p>
      `;

    document.getElementById(
      "myOrdersTotal"
    ).textContent =
      "₺0";

    return;
  }


  let total =
    0;


  container.innerHTML =
    data.map(
      order => {

        const orderTotal =
          Number(
            order.total || 0
          );


        total +=
          orderTotal;


        const statusNames = {

          new:
            "Yeni",

          preparing:
            "Hazırlanıyor",

          ready:
            "Hazır",

          completed:
            "Tamamlandı"

        };


        const status =
          statusNames[
            order.status
          ] ||
          order.status;


        const items =
          (
            order.order_items ||
            []
          )
          .map(
            item => `

              <div
                class="my-order-item"
              >

                <span>
                  ${item.quantity} ×
                  ${esc(
                    item.product_name
                  )}
                </span>

                <strong>
                  ₺${(
                    Number(
                      item.unit_price
                    ) *
                    Number(
                      item.quantity
                    )
                  ).toFixed(2)}
                </strong>

              </div>

            `
          )
          .join("");


        return `

          <article
            class="my-order"
          >

            <div
              class="my-order-head"
            >

              <strong>
                Sipariş
              </strong>

              <span>
                ${new Date(
                  order.created_at
                ).toLocaleTimeString(
                  "tr-TR",
                  {
                    hour:
                      "2-digit",

                    minute:
                      "2-digit"
                  }
                )}
              </span>

            </div>


            <div
              class="my-order-status"
            >
              ${esc(status)}
            </div>


            <div>

              ${items}

            </div>


            <div
              class="my-order-total"
            >

              <span>
                Toplam
              </span>

              <strong>
                ₺${orderTotal.toFixed(2)}
              </strong>

            </div>

          </article>

        `;

      }
    ).join("");


  document.getElementById(
    "myOrdersTotal"
  ).textContent =
    "₺" +
    total.toFixed(2);

}

/* =====================================================

===================================================== */

function scrollToCategory(
  category
) {

  const element =
    document.getElementById(
      "cat-" +
      slug(category)
    );


  if (element) {

    element.scrollIntoView({

      behavior:
        "smooth",

      block:
        "start"

    });

  }

}


/* =====================================================
   HELPERS
===================================================== */

function slug(
  text
) {

  return String(
    text || ""
  )
    .toLowerCase()
    .replace(
      /[^a-z0-9çğıöşü]+/g,
      "-"
    );

}


function esc(
  text
) {

  return String(
    text ?? ""
  ).replace(
    /[&<>"']/g,
    character => ({

      "&":
        "&amp;",

      "<":
        "&lt;",

      ">":
        "&gt;",

      '"':
        "&quot;",

      "'":
        "&#39;"

    })[character]
  );

}


function escAttr(
  text
) {

  return esc(text);

}
