<!doctype html>
<html lang="tr">

<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Markus Foodbar</title>

  <link
    rel="stylesheet"
    href="style.css?v=200"
  >

  <style>

    /* =====================================
       MARKUS RENKLERİ
    ===================================== */

    :root {
      --markus-green: #07553f;
      --markus-dark: #064936;
      --markus-cream: #f7f2e9;
      --markus-gold: #b79668;
      --markus-line: #d9d1c5;
      --markus-text: #164c3d;
      --markus-muted: #77736c;
    }


    * {
      box-sizing: border-box;
    }


    html {
      background: var(--markus-cream);
    }


    body {
      margin: 0;

      min-height: 100vh;

      background: var(--markus-cream);

      color: var(--markus-text);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "SF Pro Text",
        "Helvetica Neue",
        Arial,
        sans-serif;

      -webkit-font-smoothing: antialiased;
    }


    /* =====================================
       MRX / MARKUS GİRİŞ EKRANI
    ===================================== */

    #mrxWelcome {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 28px;

      background: var(--markus-cream);

      transition:
        opacity 0.45s ease,
        visibility 0.45s ease;
    }


    #mrxWelcome.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    .mrx-welcome-content {

      width: 100%;

      max-width: 390px;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;
    }


    /* =====================================
       MARKUS LOGO
    ===================================== */

    .markus-logo {

      width: 235px;

      height: 235px;

      border: 1.5px solid #c9c1b6;

      border-radius: 50%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      position: relative;

      background:
        rgba(255,255,255,0.16);

      margin-bottom: 50px;
    }


    .markus-sun {

      width: 34px;

      height: 34px;

      border-radius: 50%;

      background: var(--markus-gold);

      margin-bottom: 16px;

      position: relative;
    }


    .markus-sun::before {

      content: "";

      position: absolute;

      inset: -9px;

      border-radius: 50%;

      border: 2px dotted var(--markus-gold);

      opacity: 0.75;
    }


    .markus-name {

      color: var(--markus-green);

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 31px;

      font-weight: 600;

      letter-spacing: 5px;

      line-height: 1;

      margin-left: 5px;
    }


    .markus-foodbar {

      margin-top: 11px;

      color: var(--markus-gold);

      font-size: 12px;

      font-weight: 600;

      letter-spacing: 3px;
    }


    .markus-waves {

      margin-top: 17px;

      color: var(--markus-green);

      font-size: 25px;

      letter-spacing: -4px;

      line-height: 0.6;
    }


    /* =====================================
       MENÜYÜ GÖR
    ===================================== */

    .mrx-menu-button {

      width: 100%;

      max-width: 340px;

      padding: 17px 24px;

      border: none;

      border-radius: 12px;

      background: var(--markus-green);

      color: white;

      font-family: inherit;

      font-size: 16px;

      font-weight: 700;

      cursor: pointer;

      transition:
        transform 0.15s ease,
        opacity 0.15s ease;
    }


    .mrx-menu-button:active {

      transform: scale(0.97);

      opacity: 0.85;
    }


    .mrx-footer {

      margin-top: 38px;

      color: #777;

      font-size: 10px;

      letter-spacing: 2px;
    }


    /* =====================================
       MENÜ
    ===================================== */

    #mainMenuContent {

      display: none;

      min-height: 100vh;

      background: var(--markus-cream);

      color: var(--markus-text);
    }


    #mainMenuContent.visible {

      display: block;
    }


    /* =====================================
       TOPBAR
    ===================================== */

    #mainMenuContent .topbar {

      position: relative;

      display: flex;

      flex-direction: column;

      align-items: center;

      padding: 25px 18px 20px;

      background: var(--markus-cream) !important;

      border: none !important;
    }


    #mainMenuContent .topbar > div:first-child {

      display: none;
    }


    /* =====================================
       MENÜDEKİ MARKUS LOGOSU
    ===================================== */

    .menu-markus-logo {

      width: 150px;

      height: 150px;

      border: 1px solid #c9c1b6;

      border-radius: 50%;

      display: flex;

      flex-direction: column;

      align-items: center;

      justify-content: center;

      background:
        rgba(255,255,255,0.18);

      margin-bottom: 14px;
    }


    .menu-markus-logo .markus-sun {

      width: 23px;

      height: 23px;

      margin-bottom: 10px;
    }


    .menu-markus-logo .markus-name {

      font-size: 20px;

      letter-spacing: 3px;
    }


    .menu-markus-logo .markus-foodbar {

      font-size: 8px;

      margin-top: 7px;

      letter-spacing: 2px;
    }


    .menu-markus-logo .markus-waves {

      font-size: 17px;

      margin-top: 10px;
    }


    /* =====================================
       MASA
    ===================================== */

    #mainMenuContent .table-badge {

      position: absolute;

      right: 18px;

      top: 28px;

      padding: 10px 14px;

      border-radius: 11px;

      background: var(--markus-green) !important;

      color: #fff !important;

      font-size: 13px;

      font-weight: 700;
    }


    /* =====================================
       SİPARİŞLERİM
    ===================================== */

    .orders-history-button {

      width: calc(100% - 32px);

      margin: 0 16px 20px;

      padding: 15px 17px;

      display: flex;

      align-items: center;

      justify-content: space-between;

      border: 1.5px solid var(--markus-green);

      border-radius: 13px;

      background: transparent;

      color: var(--markus-green);

      font-family: inherit;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;
    }


    .orders-history-button .arrow {

      font-size: 22px;

      line-height: 1;
    }


    /* =====================================
       MAIN
    ===================================== */

    #mainMenuContent main {

      max-width: 700px;

      margin: 0 auto;

      padding:
        0 16px 120px;

      background:
        var(--markus-cream) !important;
    }


    /* =====================================
       KATEGORİLER
    ===================================== */

    #mainMenuContent .categories {

      display: flex;

      gap: 8px;

      overflow-x: auto;

      scrollbar-width: none;

      padding:
        0 0 7px;

      margin-bottom: 22px;

      background:
        transparent !important;
    }


    #mainMenuContent .categories::-webkit-scrollbar {
      display: none;
    }


    #mainMenuContent .categories button {

      flex: 0 0 auto;

      padding: 10px 15px;

      border: 1px solid #d5cec3 !important;

      border-radius: 999px;

      background: #fff !important;

      color: var(--markus-green) !important;

      font-family: inherit;

      font-size: 13px;

      font-weight: 650;

      white-space: nowrap;
    }


    #mainMenuContent .categories button.active,
    #mainMenuContent .categories button.selected {

      background:
        var(--markus-green) !important;

      color: white !important;

      border-color:
        var(--markus-green) !important;
    }


    /* =====================================
       MENÜ
    ===================================== */

    #mainMenuContent .menu {

      display: flex;

      flex-direction: column;

      gap: 25px;

      background:
        transparent !important;
    }


    #mainMenuContent .menu > section {

      background: transparent;
    }


    /* =====================================
       KATEGORİ BAŞLIKLARI
    ===================================== */

    #mainMenuContent .category-title {

      margin:
        5px 0 12px;

      color:
        var(--markus-green) !important;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 25px;

      font-weight: 700;
    }


    /* =====================================
       ÜRÜN KARTLARI
    ===================================== */

    #mainMenuContent .product {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 14px;

      padding: 16px;

      margin-bottom: 9px;

      border:
        1px solid var(--markus-line) !important;

      border-radius: 14px;

      background:
        rgba(255,255,255,0.35) !important;

      color:
        var(--markus-text) !important;
    }


    #mainMenuContent .product-info {

      min-width: 0;

      flex: 1;
    }


    #mainMenuContent .product h3 {

      margin:
        0 0 6px;

      color:
        var(--markus-green) !important;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      font-size: 17px;

      font-weight: 700;
    }


    #mainMenuContent .product p {

      margin:
        0 0 8px;

      color:
        #777 !important;

      font-size: 13px;

      line-height: 1.4;
    }


    #mainMenuContent .price {

      color:
        var(--markus-green) !important;

      font-size: 15px;

      font-weight: 750;
    }


    /* =====================================
       EKLE
    ===================================== */

    #mainMenuContent .product .add {

      flex: 0 0 auto;

      padding:
        11px 15px;

      border:
        1px solid var(--markus-green) !important;

      border-radius: 10px;

      background:
        var(--markus-green) !important;

      color:
        #fff !important;

      font-family: inherit;

      font-size: 13px;

      font-weight: 700;
    }


    /* =====================================
       SEPET
    ===================================== */

    #mainMenuContent .cart-button {

      position: fixed;

      z-index: 500;

      left: 50%;

      bottom: 18px;

      transform:
        translateX(-50%);

      width: calc(100% - 34px);

      max-width: 580px;

      padding: 15px;

      border:
        1px solid var(--markus-green) !important;

      border-radius: 13px;

      background:
        var(--markus-green) !important;

      color:
        #fff !important;

      font-family: inherit;

      font-size: 15px;

      font-weight: 700;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,0.12);
    }


    #mainMenuContent #cartCount {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 23px;

      height: 23px;

      margin-left: 6px;

      border-radius: 50%;

      background: #fff !important;

      color:
        var(--markus-green) !important;

      font-size: 11px;
    }


    /* =====================================
       SEPET MODAL
    ===================================== */

    #mainMenuContent .modal {

      background:
        rgba(20,30,25,0.45);
    }


    #mainMenuContent .modal-card {

      background:
        var(--markus-cream) !important;

      color:
        var(--markus-text) !important;

      border:
        1px solid var(--markus-line) !important;

      border-radius:
        22px 22px 16px 16px;
    }


    #mainMenuContent .modal-card h2 {

      color:
        var(--markus-green) !important;

      font-family:
        Georgia,
        "Times New Roman",
        serif;
    }


    #mainMenuContent .modal-head button {

      background:
        var(--markus-green) !important;

      color: white !important;
    }


    #mainMenuContent #cartItems > div {

      background:
        #fff !important;

      color:
        var(--markus-text) !important;

      border-color:
        var(--markus-line) !important;
    }


    #mainMenuContent .order-summary {

      border-color:
        var(--markus-line) !important;
    }


    #mainMenuContent .order-summary strong {

      color:
        var(--markus-green) !important;
    }


    #mainMenuContent textarea {

      background: #fff !important;

      color:
        var(--markus-text) !important;

      border-color:
        var(--markus-line) !important;
    }


    #mainMenuContent .primary {

      background:
        var(--markus-green) !important;

      color: #fff !important;

      border-color:
        var(--markus-green) !important;
    }


    /* =====================================
       MOBİL
    ===================================== */

    @media (max-width: 600px) {

      .markus-logo {

        width: 220px;

        height: 220px;

        margin-bottom: 45px;
      }


      .markus-name {

        font-size: 29px;
      }


      .menu-markus-logo {

        width: 135px;

        height: 135px;
      }


      #mainMenuContent .table-badge {

        top: 24px;

        right: 15px;
      }


      #mainMenuContent main {

        padding-left: 14px;

        padding-right: 14px;
      }


      .orders-history-button {

        width:
          calc(100% - 28px);

        margin-left: 14px;

        margin-right: 14px;
      }
    }

  </style>

</head>


<body>


  <!-- =====================================
       MARKUS GİRİŞ EKRANI
  ===================================== -->

  <section id="mrxWelcome">

    <div class="mrx-welcome-content">


      <!-- MARKUS LOGO -->

      <div class="markus-logo">

        <div class="markus-sun"></div>

        <div class="markus-name">
          MARKUS
        </div>

        <div class="markus-foodbar">
          FOODBAR
        </div>

        <div class="markus-waves">
          ≋≋≋
        </div>

      </div>


      <!-- BUTON -->

      <button
        class="mrx-menu-button"
        onclick="openMRXMenu()"
      >
        Menüyü Gör →
      </button>


      <div class="mrx-footer">
        POWERED BY MRX
      </div>


    </div>

  </section>



  <!-- =====================================
       ANA MENÜ
  ===================================== -->

  <div id="mainMenuContent">


    <header class="topbar">


      <!-- MARKUS LOGO -->

      <div class="menu-markus-logo">

        <div class="markus-sun"></div>

        <div class="markus-name">
          MARKUS
        </div>

        <div class="markus-foodbar">
          FOODBAR
        </div>

        <div class="markus-waves">
          ≋≋≋
        </div>

      </div>


      <!-- MASA -->

      <div
        class="table-badge"
        id="tableBadge"
      >
        Masa
      </div>


    </header>



    <!-- =====================================
         SİPARİŞLERİM
    ===================================== -->

    <button
      id="ordersHistoryButton"
      class="orders-history-button"
      onclick="openOrderHistory()"
    >

      <span>
        Siparişlerim
      </span>

      <span class="arrow">
        ›
      </span>

    </button>



    <!-- =====================================
         MENÜ
    ===================================== -->

    <main>


      <div
        id="notice"
        class="notice hidden"
      ></div>


      <div
        id="categories"
        class="categories"
      ></div>


      <section
        id="menu"
        class="menu"
      ></section>


    </main>



    <!-- =====================================
         SEPET
    ===================================== -->

    <button
      id="cartButton"
      class="cart-button"
      onclick="openCart()"
    >

      Sepet

      <span id="cartCount">
        0
      </span>

    </button>



    <!-- =====================================
         SEPET MODALI
    ===================================== -->

    <div
      id="cartModal"
      class="modal hidden"
    >

      <div class="modal-card">


        <div class="modal-head">

          <h2>
            Sepet
          </h2>


          <button
            onclick="closeCart()"
          >
            ×
          </button>

        </div>


        <div
          id="cartItems"
        ></div>


        <div class="order-summary">

          <span>
            Toplam
          </span>

          <strong id="cartTotal">
            ₺0
          </strong>

        </div>


        <label class="label">
          Sipariş notu
        </label>


        <textarea
          id="orderNote"
          placeholder="Örn. Soğansız, sos ayrı..."
        ></textarea>


        <button
          class="primary"
          onclick="placeOrder()"
        >
          Siparişi Gönder
        </button>


      </div>

    </div>


    <!-- =====================================
         SİPARİŞ GEÇMİŞİ MODALI
    ===================================== -->

    <div
      id="orderHistoryModal"
      class="modal hidden"
    >

      <div class="modal-card">

        <div class="modal-head">

          <h2>
            Siparişlerim
          </h2>

          <button
            onclick="closeOrderHistory()"
          >
            ×
          </button>

        </div>


        <div id="orderHistoryContent">

          <p>
            Sipariş geçmişiniz yükleniyor...
          </p>

        </div>


      </div>

    </div>


  </div>



  <!-- =====================================
       SUPABASE
  ===================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <script src="./markus.js?v=1"></script>



  <!-- =====================================
       MARKUS MENÜ AÇMA
  ===================================== -->

  <script>

    function openMRXMenu() {

      const welcome =
        document.getElementById(
          "mrxWelcome"
        );

      const menu =
        document.getElementById(
          "mainMenuContent"
        );


      menu.classList.add(
        "visible"
      );


      welcome.classList.add(
        "hidden"
      );


      setTimeout(function () {

        welcome.style.display =
          "none";

      }, 500);

    }



    /* =====================================
       SİPARİŞ GEÇMİŞİ
       app.js'deki fonksiyonlar
       hazır değilse bile buton hata vermez.
    ===================================== */

    function openOrderHistory() {

      const modal =
        document.getElementById(
          "orderHistoryModal"
        );

      if (!modal) {
        return;
      }

      modal.classList.remove(
        "hidden"
      );

      if (
        typeof loadOrderHistory ===
        "function"
      ) {

        loadOrderHistory();

      } else {

        document.getElementById(
          "orderHistoryContent"
        ).innerHTML = `
          <p>
            Sipariş geçmişi hazırlanıyor...
          </p>
        `;
      }

    }


    function closeOrderHistory() {

      const modal =
        document.getElementById(
          "orderHistoryModal"
        );

      if (!modal) {
        return;
      }

      modal.classList.add(
        "hidden"
      );

    }

  </script>


</body>

</html>
