<!doctype html>
<html lang="tr">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Markus Foodbar</title>

  <link
    rel="stylesheet"
    href="./style.css?v=200"
  >

  <style>

    /* =====================================
       MARKUS ANA SAYFA
    ===================================== */

    * {
      box-sizing: border-box;
    }

    html {
      background: #f3eee5;
    }

    body {
      margin: 0;
      min-height: 100vh;

      background: #f3eee5;
      color: #174f3b;

      font-family:
        Georgia,
        "Times New Roman",
        serif;

      -webkit-font-smoothing: antialiased;
    }


    /* =====================================
       MARKUS GİRİŞ
    ===================================== */

    #markusWelcome {

      position: fixed;

      inset: 0;

      z-index: 99999;

      display: flex;

      align-items: center;
      justify-content: center;

      padding: 30px;

      background: #f3eee5;

      transition:
        opacity .45s ease,
        visibility .45s ease;

    }


    #markusWelcome.hidden {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;

    }


    .markus-welcome {

      width: 100%;

      max-width: 390px;

      text-align: center;

      display: flex;

      flex-direction: column;

      align-items: center;

    }


    /* Logo */

    .markus-logo {

      width: 150px;

      height: 150px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      border: 1px solid #c9c2b5;

      background: #f8f4ed;

      color: #174f3b;

      font-size: 28px;

      font-weight: 700;

      letter-spacing: 2px;

    }


    .markus-logo-small {

      width: 90px;

      height: 90px;

      border-radius: 50%;

      display: flex;

      align-items: center;

      justify-content: center;

      border: 1px solid #c9c2b5;

      background: #f8f4ed;

      color: #174f3b;

      font-size: 19px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    .markus-open-button {

      margin-top: 42px;

      width: 100%;

      max-width: 280px;

      padding: 16px 24px;

      border: 1px solid #174f3b;

      border-radius: 8px;

      background: #174f3b;

      color: #fff;

      font-family: inherit;

      font-size: 16px;

      font-weight: 600;

      cursor: pointer;

    }


    .markus-open-button:active {

      transform: scale(.98);

    }


    /* =====================================
       MENÜ
    ===================================== */

    #mainMarkusMenu {

      display: none;

      min-height: 100vh;

      background: #f3eee5;

    }


    #mainMarkusMenu.visible {

      display: block;

    }


    /* =====================================
       HEADER
    ===================================== */

    .markus-header {

      padding: 20px 18px 18px;

      background: #f3eee5;

      border-bottom:
        1px solid #c9c2b5;

      display: flex;

      align-items: center;

      justify-content: space-between;

    }


    .markus-brand {

      display: flex;

      align-items: center;

      gap: 12px;

    }


    .markus-brand-name {

      color: #174f3b;

      font-size: 23px;

      font-weight: 700;

      letter-spacing: 1px;

    }


    .markus-table {

      padding: 9px 13px;

      border-radius: 8px;

      background: #174f3b;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 13px;

      font-weight: 600;

    }


    /* =====================================
       MAIN
    ===================================== */

    #mainMarkusMenu main {

      width: 100%;

      max-width: 720px;

      margin: 0 auto;

      padding:
        22px
        16px
        130px;

    }


    /* =====================================
       NOTICE
    ===================================== */

    .notice {

      margin-bottom: 18px;

      padding: 13px 15px;

      border:
        1px solid #bdb5a8;

      border-radius: 10px;

      background: #eee8dd;

      color: #174f3b;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 14px;

    }


    .hidden {

      display: none !important;

    }


    /* =====================================
       CATEGORIES
    ===================================== */

    .categories {

      display: flex;

      gap: 8px;

      margin-bottom: 30px;

      overflow-x: auto;

      padding-bottom: 5px;

      scrollbar-width: none;

    }


    .categories::-webkit-scrollbar {

      display: none;

    }


    .categories button {

      flex: 0 0 auto;

      padding: 10px 16px;

      border:
        1px solid #c6beb1;

      border-radius: 999px;

      background: transparent;

      color: #174f3b;

      font-family: inherit;

      font-size: 13px;

      font-weight: 600;

    }


    .categories button.active,
    .categories button.selected {

      background: #174f3b;

      color: #fff;

      border-color: #174f3b;

    }


    /* =====================================
       MENU
    ===================================== */

    .menu {

      display: flex;

      flex-direction: column;

      gap: 30px;

      background: transparent;

    }


    .menu section {

      scroll-margin-top: 20px;

    }


    .category-title {

      margin:
        10px
        0
        15px;

      color: #174f3b;

      font-size: 27px;

      font-weight: 700;

      text-align: center;

    }


    /* =====================================
       PRODUCT
    ===================================== */

    .product {

      position: relative;

      display: flex;

      align-items: flex-end;

      justify-content: space-between;

      gap: 15px;

      margin-bottom: 10px;

      padding: 17px;

      border:
        1px solid #d5cec2;

      border-radius: 12px;

      background: #f8f4ed;

    }


    .product-info {

      min-width: 0;

      flex: 1;

    }


    .product h3 {

      margin:
        0
        0
        5px;

      color: #174f3b;

      font-size: 19px;

      font-weight: 700;

    }


    .product p {

      margin:
        0
        0
        8px;

      color: #66776e;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 12px;

      line-height: 1.45;

    }


    .price {

      color: #174f3b;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 16px;

      font-weight: 700;

    }


    .product .add {

      flex: 0 0 auto;

      padding: 10px 15px;

      border: 0;

      border-radius: 8px;

      background: #174f3b;

      color: #fff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 13px;

      font-weight: 600;

      cursor: pointer;

    }


    /* =====================================
       SEPET
    ===================================== */

    .cart-button {

      position: fixed;

      left: 50%;

      bottom: 18px;

      transform:
        translateX(-50%);

      z-index: 500;

      min-width: 200px;

      padding: 15px 22px;

      border: 0;

      border-radius: 12px;

      background: #174f3b;

      color: #fff;

      box-shadow:
        0 8px 25px
        rgba(0,0,0,.18);

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Helvetica Neue",
        Arial,
        sans-serif;

      font-size: 15px;

      font-weight: 700;

      cursor: pointer;

    }


    #cartCount {

      display: inline-flex;

      align-items: center;

      justify-content: center;

      min-width: 21px;

      height: 21px;

      margin-left: 6px;

      padding: 0 6px;

      border-radius: 999px;

      background: #fff;

      color: #174f3b;

      font-size: 11px;

    }


    /* =====================================
       MODAL
    ===================================== */

    .modal {

      position: fixed;

      inset: 0;

      z-index: 1000;

      display: flex;

      align-items: flex-end;

      justify-content: center;

      padding: 14px;

      background:
        rgba(23,79,59,.25);

      backdrop-filter:
        blur(7px);

    }


    .modal-card {

      width: 100%;

      max-width: 600px;

      max-height: 88vh;

      overflow-y: auto;

      padding: 21px;

      border-radius:
        20px
        20px
        14px
        14px;

      background: #f8f4ed;

      color: #174f3b;

      border:
        1px solid #d5cec2;

      box-shadow:
        0 -10px 40px
        rgba(0,0,0,.15);

    }


    .modal-head {

      display: flex;

      align-items: center;

      justify-content: space-between;

      margin-bottom: 18px;

    }


    .modal-head h2 {

      margin: 0;

      color: #174f3b;

      font-size: 25px;

    }


    .modal-head button {

      width: 36px;

      height: 36px;

      border: 0;

      border-radius: 50%;

      background: #174f3b;

      color: #fff;

      font-size: 22px;

    }


    #cartItems {

      display: flex;

      flex-direction: column;

      gap: 10px;

      margin-bottom: 18px;

    }


    #cartItems > div {

      padding: 14px;

      border:
        1px solid #d5cec2;

      border-radius: 11px;

      background: #fff;

    }


    .cart-main {

      display: flex;

      align-items: center;

      justify-content: space-between;

      gap: 10px;

      color: #174f3b;

    }


    .qty {

      display: flex;

      align-items: center;

      gap: 10px;

      margin-top: 10px;

    }


    .qty button {

      width: 30px;

      height: 30px;

      border: 0;

      border-radius: 50%;

      background: #174f3b;

      color: #fff;

    }


    .item-note {

      width: 100%;

      margin-top: 10px;

      padding: 10px;

      border:
        1px solid #d5cec2;

      border-radius: 8px;

      background: #f8f4ed;

      color: #174f3b;

      font-family: inherit;

    }


    .order-summary {

      display: flex;

      justify-content: space-between;

      padding: 16px 0;

      margin-bottom: 17px;

      border-top:
        1px solid #d5cec2;

      border-bottom:
        1px solid #d5cec2;

      color: #66776e;

    }


    .order-summary strong {

      color: #174f3b;

      font-size: 20px;

    }


    .label {

      display: block;

      margin-bottom: 7px;

      color: #174f3b;

      font-size: 13px;

      font-weight: 700;

    }


    textarea {

      width: 100%;

      min-height: 90px;

      padding: 12px;

      margin-bottom: 13px;

      resize: vertical;

      border:
        1px solid #d5cec2;

      border-radius: 10px;

      background: #fff;

      color: #174f3b;

      font-family: inherit;

      font-size: 14px;

      outline: none;

    }


    .primary {

      width: 100%;

      padding: 15px;

      border: 0;

      border-radius: 10px;

      background: #174f3b;

      color: #fff;

      font-family: inherit;

      font-size: 15px;

      font-weight: 700;

    }


    /* =====================================
       MOBİL
    ===================================== */

    @media (max-width: 600px) {

      .markus-logo {

        width: 135px;

        height: 135px;

        font-size: 25px;

      }


      .markus-brand-name {

        font-size: 21px;

      }


      #mainMarkusMenu main {

        padding:
          18px
          14px
          120px;

      }


      .product {

        padding: 15px;

      }


      .product h3 {

        font-size: 18px;

      }


      .category-title {

        font-size: 25px;

      }

    }

  </style>

</head>


<body>


  <!-- =====================================
       MARKUS GİRİŞ EKRANI
  ===================================== -->

  <section id="markusWelcome">

    <div class="markus-welcome">

      <div class="markus-logo">
        MARKUS
      </div>


      <button
        class="markus-open-button"
        onclick="openMarkusMenu()"
      >
        Menüyü Gör →
      </button>

    </div>

  </section>



  <!-- =====================================
       MARKUS MENÜ
  ===================================== -->

  <div id="mainMarkusMenu">


    <header class="markus-header">

      <div class="markus-brand">

        <div class="markus-logo-small">
          MARKUS
        </div>

        <div class="markus-brand-name">
          FOODBAR
        </div>

      </div>


      <div
        class="markus-table"
        id="tableBadge"
      >
        Masa
      </div>

    </header>



    <main>


      <div
        id="notice"
        class="notice hidden"
      ></div>


      <div
        id="categories"
        class="categories"
      ></div>


      <section
        id="menu"
        class="menu"
      ></section>


    </main>



    <!-- SEPET -->

    <button
      id="cartButton"
      class="cart-button"
      onclick="openCart()"
    >

      Sepet

      <span id="cartCount">
        0
      </span>

    </button>



    <!-- SEPET MODAL -->

    <div
      id="cartModal"
      class="modal hidden"
    >

      <div class="modal-card">


        <div class="modal-head">

          <h2>
            Sepet
          </h2>

          <button
            onclick="closeCart()"
          >
            ×
          </button>

        </div>


        <div
          id="cartItems"
        ></div>


        <div class="order-summary">

          <span>
            Toplam
          </span>

          <strong
            id="cartTotal"
          >
            ₺0
          </strong>

        </div>


        <label class="label">
          Sipariş notu
        </label>


        <textarea
          id="orderNote"
          placeholder="Örn. Soğansız, sos ayrı..."
        ></textarea>


        <button
          class="primary"
          onclick="placeOrder()"
        >
          Siparişi Gönder
        </button>


      </div>

    </div>


  </div>



  <!-- =====================================
       SUPABASE
  ===================================== -->

  <script
    src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"
  ></script>


  <!-- MARKUS JS -->

  <script
    src="./markus.js?v=4"
  ></script>



  <!-- =====================================
       MARKUS MENÜ AÇ
  ===================================== -->

  <script>

    function openMarkusMenu() {

      const welcome =
        document.getElementById(
          "markusWelcome"
        );

      const menu =
        document.getElementById(
          "mainMarkusMenu"
        );


      menu.classList.add(
        "visible"
      );


      welcome.classList.add(
        "hidden"
      );


      setTimeout(
        function() {

          welcome.style.display =
            "none";

        },
        500
      );

    }

  </script>


</body>

</html>
