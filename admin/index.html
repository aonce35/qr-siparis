<!doctype html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QR Sipariş - Admin</title>
  <link rel="stylesheet" href="style.css?v=3">
</head>

<body>

<div id="loginView" class="center">
  <div class="login-card">

    <h1>QR Sipariş</h1>

    <p>Garson / Mekan Sahibi Paneli</p>

    <input
      id="email"
      type="email"
      placeholder="E-posta"
      autocomplete="email"
    >

    <input
      id="password"
      type="password"
      placeholder="Şifre"
      autocomplete="current-password"
    >

    <button
      id="loginButton"
      type="button"
      onclick="login()"
    >
      Giriş Yap
    </button>

    <div id="loginError"></div>

  </div>
</div>


<div id="appView" class="hidden">

  <header>
    <div>
      <span class="eyebrow">
        CANLI SİPARİŞLER
      </span>

      <h1>Admin Paneli</h1>
    </div>

    <button
      class="logout"
      type="button"
      onclick="logout()"
    >
      Çıkış
    </button>
    <button
  id="enableNotifications"
  type="button"
  onclick="enableNotifications()"
  style="
    margin-top:10px;
    padding:10px 14px;
    border:0;
    border-radius:10px;
    background:#171717;
    color:white;
    font-weight:700;
  "
>
  🔔 Bildirimleri Aç
</button>
  </header>


  <main>

    <div class="stats">

      <div>
        <small>Yeni</small>
        <strong id="newCount">0</strong>
      </div>

      <div>
        <small>Hazırlanıyor</small>
        <strong id="prepCount">0</strong>
      </div>

      <div>
        <small>Hazır</small>
        <strong id="readyCount">0</strong>
      </div>

    </div>


    <div
      class="board"
      id="orders"
    >
      <div class="order">
        Siparişler yükleniyor...
      </div>
    </div>

  </main>

</div>


<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script src="app.js?v=999"></script>

</body>
</html>
